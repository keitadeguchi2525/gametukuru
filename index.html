<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#120e0b;color:#f1e6d2;font-family:'M PLUS 1p',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
#hub{position:fixed;inset:0;overflow-y:auto;background:radial-gradient(ellipse at 50% -10%,#3b2a1c 0%,#1a120c 55%,#0d0907 100%)}

#cv{display:block;touch-action:none}

#pause:active{transform:translateY(1px)}

#pauseOv h2{font-size:26px;font-weight:900;color:#ffe2ad;margin-bottom:6px}#pauseOv p{font-size:14px;color:#d8c6aa;line-height:1.6;margin:6px 0}
#pauseOv .pbtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}#pauseOv .btn{font-size:16px;padding:12px}
#pauseOv .tstep{font-size:12px;color:#c98a3a;font-weight:700;letter-spacing:.1em}#pauseOv .tintro{text-align:left;font-size:15px;line-height:1.75;color:#ead8bc}#pauseOv .tintro b{color:#ffd58a}#pauseOv .tsub{font-size:13px;color:#bba78a}#pauseOv .tsub b{color:#e0cba8}
#pauseOv .audio{margin:12px 0 0}#pauseOv .sbtn{font-size:14px;padding:8px 16px}
#pauseOv .btn.danger{background:linear-gradient(#e0644a,#a8321e);color:#fff3ea;box-shadow:0 3px 0 #5a1a0e}
.audio{display:flex;gap:8px;justify-content:center;margin:-4px 0 14px}
.sbtn{font:700 12px 'M PLUS 1p';padding:5px 12px;border-radius:16px;border:1px solid #6b4a2a;background:#2a1e15;color:#ffd58a;cursor:pointer}
.sbtn.off{color:#8a7a66;border-color:#3d2b1b}
#dodgeL{left:16px}#dodgeR{right:16px}
.dodgebtn{position:absolute;bottom:56px;width:84px;height:84px;border-radius:50%;border:3px solid #9fd8ff;background:radial-gradient(circle at 40% 35%,rgba(90,150,200,.55),rgba(20,40,70,.75));color:#e8f6ff;font:900 17px 'M PLUS 1p';cursor:pointer;touch-action:none;box-shadow:0 0 14px rgba(120,200,255,.35)}

.dodgebtn small{display:block;font-size:10px;font-weight:700;opacity:.7}
.dodgebtn.warn{border-color:#ff5a5a;background:radial-gradient(circle at 40% 35%,rgba(255,90,90,.7),rgba(90,10,10,.8));animation:pulse .35s infinite alternate}
.dodgebtn.cd{opacity:.45}
.dodgebtn.tired{border-color:#8a7a55;background:radial-gradient(circle at 40% 35%,rgba(120,105,70,.6),rgba(40,32,18,.85));color:#c9b98f;animation:none}
.stam{position:absolute;bottom:148px;width:84px;display:flex;justify-content:center;gap:5px;pointer-events:none}
#stamL{left:16px}#stamR{right:16px}
.stam i{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,220,120,.75);background:linear-gradient(to top,#ffd85a calc(var(--f)*100%),rgba(0,0,0,.45) calc(var(--f)*100%));box-shadow:0 0 4px rgba(0,0,0,.6)}
.stam i.on{background:#ffd85a;box-shadow:0 0 6px rgba(255,210,80,.7)}
.stam.empty i{border-color:rgba(255,120,90,.8)}
.dodgebtn.lock{border-color:#777;background:radial-gradient(circle at 40% 35%,rgba(110,110,110,.7),rgba(30,30,30,.85));color:#aaa;animation:none}
.dodgebtn.lock::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:58px;color:rgba(255,90,90,.75);font-weight:900}
@keyframes pulse{to{transform:scale(1.1);box-shadow:0 0 28px rgba(255,80,80,.8)}}
#gacha{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(8,5,3,.8)}
#gachaBox{background:linear-gradient(#2a1d12,#1a120b);border:2px solid #c98a3a;border-radius:16px;padding:22px 20px;width:min(360px,90vw);text-align:center}
.capsule{width:110px;height:110px;margin:6px auto 14px;border-radius:50%;position:relative;animation:shake .12s infinite alternate}
.capsule.open{animation:pop .45s ease-out forwards}
@keyframes shake{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.gprize{font-size:20px;font-weight:900;margin:8px 0}.gprize img{width:72px;height:72px;display:block;margin:0 auto 6px}
.grate{font-size:12px;color:#bba78a;line-height:1.8}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,5,3,.72)}

#result h2{font-size:30px;font-weight:900;margin-bottom:10px}
#result .row{justify-content:center;margin:8px 0 16px}
.rarebanner{font-weight:900;color:#fff0a0;text-shadow:0 0 12px #ffb020;margin-bottom:4px}
#ver{position:fixed;left:4px;bottom:3px;font-size:10px;color:rgba(232,212,180,0.7);background:rgba(0,0,0,0.55);padding:1px 6px;border-radius:6px;pointer-events:none;z-index:50;font-family:"M PLUS 1p",sans-serif;letter-spacing:.05em}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a2814;border:1px solid #c98a3a;color:#ffe2ad;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:opacity .3s;pointer-events:none;opacity:0;z-index:9}
</style>

<body>
<div id="hub"><div class="wrap">
  <h1>⚔ パリィ・ハンター</h1>
  <div class="sub">弾いて、崩して、斬り刻め。</div>
  <div class="equip" id="equip"></div>
  <div class="audio"><button id="sndSfx" class="sbtn"></button><button id="sndBgm" class="sbtn"></button></div>
  <div class="tabs">
    <button data-tab="hunt" class="on">ダンジョン</button>
    <button data-tab="forge">工房</button>
    <button data-tab="inv">持ち物</button>
    <button data-tab="stat">ステータス</button>
    <button data-tab="gacha">ガチャ</button>
    <button data-tab="how">遊び方</button>
  </div>
  <div id="panel"></div>
</div></div>

<div id="battle" class="hidden">
  <canvas id="cv"></canvas>
  <button id="pause" title="ポーズ（Esc / P）">❚❚</button>
  <button id="dodgeL" class="dodgebtn">← 回避<small>A</small></button>
  <button id="dodgeR" class="dodgebtn">回避 →<small>D</small></button>
  <div id="stamL" class="stam"></div><div id="stamR" class="stam"></div>
  <div id="result" class="hidden"><div class="box" id="resultBox"></div></div>
  <div id="pauseOv" class="hidden"><div class="box" id="pauseBox"></div></div>
</div>
<div id="gacha" class="hidden"><div class="box" id="gachaBox"></div></div>
<div id="toast"></div>
<div id="ver"></div>

<script>
// バージョン表記（画面左下）。仕様メモ（docs/仕様メモ.md）の見出しの番号と合わせて上げる
const VERSION='v18';
// 更新番号は自動：GitHub の main に入った更新（コミット）の数を聞いて「v16.123」のように出す。最後の更新日も出す
//   つながらないとき（オフラインなど）は前回わかった番号、それもなければ「v16」だけ
const REPO='keitadeguchi2525/gametukuru',VERKEY='parryHunter_ver';
function showVer(v){document.getElementById('ver').textContent=`パリィ・ハンター ${VERSION}${v&&v.n?'.'+v.n:''}${v&&v.d?`（${v.d} 更新）`:''}`}
try{showVer(JSON.parse(localStorage.getItem(VERKEY)))}catch(e){showVer(null)}
fetch(`https://api.github.com/repos/${REPO}/commits?sha=main&per_page=1`).then(r=>{if(!r.ok)throw 0;
  const m=/[?&]page=(\d+)>;\s*rel="last"/.exec(r.headers.get('Link')||'');return r.json().then(j=>{
    const dt=new Date(j[0].commit.committer.date),v={n:m?+m[1]:1,d:`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`};
    showVer(v);try{localStorage.setItem(VERKEY,JSON.stringify(v))}catch(e){}})}).catch(()=>{});
// ===================== 素材 =====================
const MATS={
  bone:{n:'獣骨',c:'#f4ead2',c2:'#a8977a',sh:'bone'},
  shell:{n:'岩甲殻',c:'#c0a888',c2:'#5e4e3c',sh:'shell'},
  hornG:{n:'岩角',c:'#eadbb4',c2:'#8a7650',sh:'horn'},
  claw:{n:'岩爪',c:'#f6e2c6',c2:'#9a7048',sh:'claw'},
  scale:{n:'雷鱗',c:'#9ccaff',c2:'#24529e',sh:'scale'},
  horn:{n:'雷角',c:'#fff4a8',c2:'#c88c10',sh:'horn'},
  wing:{n:'雷翼膜',c:'#b4dcff',c2:'#355e98',sh:'wing'},
  tail:{n:'雷尾',c:'#78aaf4',c2:'#1a3870',sh:'tail'},
  crystal:{n:'雷晶',c:'#effdff',c2:'#4aa8d8',sh:'crystal'},
  shade:{n:'冥布',c:'#c49ce8',c2:'#45266a',sh:'cloth'},
  crown:{n:'冥冠片',c:'#ffe88e',c2:'#a87818',sh:'crownp'},
  core:{n:'冥核',c:'#faa8ff',c2:'#7a1aa8',sh:'orb'},
  soul:{n:'魂片',c:'#e8e0ff',c2:'#6a58cc',sh:'wisp'},
  // ★2 妖蛾の森
  dust:{n:'鱗粉',c:'#eef8a8',c2:'#6a8a20',sh:'wisp'},
  mothwing:{n:'妖蛾の翅',c:'#e6c8ff',c2:'#6a3aa0',sh:'wing'},
  antenna:{n:'触角',c:'#dcf2c4',c2:'#4a7030',sh:'horn'},
  silk:{n:'繭糸',c:'#f8f4ff',c2:'#9a88c0',sh:'cloth'},
  // ★4 氷霧の霊廟
  frost:{n:'霜鱗',c:'#eef9ff',c2:'#5a9ac8',sh:'scale'},
  icefang:{n:'氷牙',c:'#f6fcff',c2:'#7ab8d8',sh:'claw'},
  icecrys:{n:'永晶',c:'#fbffff',c2:'#80c8f0',sh:'crystal'},
  mstone:{n:'霊廟石',c:'#dde4ec',c2:'#5a6878',sh:'shell'},
  // レア
  heartstone:{n:'岩竜の心石',c:'#ffa060',c2:'#8a2a10',sh:'gem',rare:1},
  amber:{n:'古代の琥珀',c:'#ffd868',c2:'#b05a0c',sh:'amber',rare:2},
  goldhorn:{n:'黄金の岩角',c:'#fff4b0',c2:'#c88a08',sh:'horn',rare:3},
  gekirin:{n:'雷竜の逆鱗',c:'#ffffff',c2:'#2a7cff',sh:'scale',rare:1},

// ===================== 雑魚（ボスの色違い）とダンジョン =====================
function mixHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
// 既存の敵の体つきを借りて、色・部位の名前・素材・飾りを差し替える（o.names / o.mats / o.decos は部位id→値）
function reskin(b,o,mix){return b.parts.map(p=>({...p,c:mixHex(p.c,o.tint,mix),name:(o.names||{})[p.id]||p.name,mat:(o.mats||{})[p.id]||p.mat,
  deco:(o.decos||{})[p.id]!==undefined?o.decos[p.id]:p.deco,ice:o.ice||p.ice,hp:p.hp?Math.round(p.hp*(o.partMul||1)):undefined}))}
// o.parts があれば、その体つき（専用の見た目）をそのまま使う。部位の体力は後で ENEMY_HP から決まるので hp:1 でよい
function variant(baseId,o){const b=ENEMIES.find(e=>e.id===baseId);
  return {...b,gimmick:null,gdesc:'',...o,minion:true,parts:o.parts?o.parts.map(p=>({...p})):reskin(b,o,0.45)}}
function makeBoss(baseId,o){const b=ENEMIES.find(e=>e.id===baseId);return {...b,...o,parts:o.parts?o.parts.map(p=>({...p})):reskin(b,o,0.62)}}

function bgm(name,force){

  o.connect(fl);fl.connect(g);g.connect(SND.bgmBus);if(echo)g.connect(SND.delay);o.start(t);o.stop(t+dur+0.05);
}
function drum(kind,t,vol=1){const c=SND.ctx;

function playStep(s,i,t,sd){
  const st=i%16,ch=s.prog[Math.floor(i/16)%s.prog.length];
  if(st===0&&s.pad)for(const n of ch)voice(mf(s.root+12+n),t,sd*16*1.05,'sawtooth',0.045,{cut:s.padCut||900,attack:sd*4,det:(Math.random()-0.5)*14});
  if(s.bass&&s.bass[st]==='x')voice(mf(s.root+ch[0]),t,sd*(s.bassLen||3),s.bassType||'triangle',0.3,{cut:600});
  if(s.arpOn&&s.arpOn[st]==='x')voice(mf(s.root+ch[st%ch.length]+(s.arpOct||24)),t,sd*2.5,s.arpType||'triangle',s.arpVol||0.07,{cut:4000,echo:true});

function costChips(c){const e=Object.entries(c);if(!e.length)return '<span class="chip" style="padding:3px 8px">素材不要</span>';
  return e.map(([k,q])=>{const h=S.mats[k]||0;return chip(k,`${MATS[k].n} ${h}/${q}`,h<q?'ng':'')}).join('')}
const pct=p=>p>=0.01?Math.round(p*100)+'%':(p*100).toFixed(p>=0.001?1:2)+'%';
function renderHub(){
  const w=W_(S.eqW),as=armStat();
  $('#equip').innerHTML=`<span><img src="${weaponIcon(w)}">武器 <b>${w.name}+${S.weapons[w.id]}</b>（攻撃 ${atkStat()}）</span><span>${eqPieces().map(p=>`<img src="${armorIcon(p)}" title="${p.name}+${S.armors[p.id]}">`).join('')}防具 合計 <b>防御 ${as.def} / 体力 +${as.hp}</b></span>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  let h='';

    h+=`<div class="card" style="border-color:#7a2a20"><p style="color:#ffb0a0;margin:0">⚠ ダンジョンで手に入れた素材は<b>帰還するまで未確定</b>。倒れると<b>その探索の戦利品と、装備中の武器・防具（5つ）のうちランダムに1〜3つを失う</b>（初期装備は強化が+0に戻る）。帰還できるのは<b>決まった階をクリアしたときだけ</b>（全5階なら2F・4F、全6階なら3F・5F）。帰還すれば戦利品も装備も守れる（戦闘中に逃げることはできない）。</p></div>`;

    DUNGEONS.forEach((D,i)=>{const lock=!unlocked(i),open=OPEN_DETAIL[D.id]&&!lock;

      h+=`<div class="card ${lock?'locked':''}"><h3>${'★'.repeat(D.stars)} ${lock?'???':`${D.name}（全${D.floors.length}階）`} ${S.cleared[D.id]?'<span class="tag ok">踏破済</span>':''}</h3>
      <p>${lock?'🔒 ???':D.desc}</p>${lock?'':`<p style="font-size:12px;color:#bba78a;margin-top:2px">↩ 帰還できる階：${returnFloors(D).map(f=>f+'F').join('・')} のあと</p>`}`;

        <p style="font-size:12px;color:#a89478">部位破壊を多くするほど素材は増える。</p>`}
      h+=`<div class="row" style="justify-content:flex-end">${lock?'':`<button class="btn sub2" data-act="detail" data-id="${D.id}">${open?'詳細を閉じる':'詳細を表示'}</button>`}<button class="btn" data-act="hunt" data-i="${i}" ${lock?'disabled':''}>潜入する</button></div></div>`});
    // ボスラッシュ：★5を踏破するまでは「???」も出さない
    if(rushUnlocked())h+=`<div class="card" style="border-color:#c8a030;box-shadow:0 0 14px rgba(255,200,60,.25)"><h3>∞ ボスラッシュ（無限） ${S.rushClear?`<span class="tag ok">最高 ${S.rushClear}巡クリア</span>`:''}</h3>
      <p>★1〜★5のボスと続けて戦う。5体倒すと1巡クリアで、巡が進むほど敵が強くなる。</p>

    if(!uraTierOpen(uraTier))uraTier=1;

    else{const k=uraTier;h+=`<p style="font-size:12px;color:#c8a8e8;margin:2px 4px 8px">裏${k}：ボスラッシュ${k+1}巡目より少し強い敵が出る。素材とレア素材が${k+1}倍出やすい。</p>`;

        h+=`<div class="card ${lock?'locked':''}" style="border-color:#7a40b0;box-shadow:0 0 12px rgba(160,64,255,.2)"><h3>裏${k} ${uraStars(D.stars)} ${lock?'???':`${D.name}（全${D.floors.length}階）`} ${done?'<span class="tag ok">踏破済</span>':''}</h3>
        <p>${lock?'🔒 ひとつ前の裏ダンジョンを踏破すると解放':D.desc}</p>${lock?'':`<p style="font-size:12px;color:#bba78a;margin-top:2px">↩ 帰還できる階：${returnFloors(D).map(f=>f+'F').join('・')} のあと</p>`}

        if(!owned){h+=`<div class="row">${costChips(it.cost)}</div><div class="row"><button class="btn" data-act="craft" data-k="${kind}" data-id="${it.id}" ${has(it.cost)?'':'disabled'}>作成する</button></div>`}
        else{const c=upgCost(it,lv);
          h+=`<div class="row">${lv<maxLv()?costChips(c):'<span class="chip" style="padding:3px 8px">強化MAX</span>'}</div><div class="row">

          ${lv<maxLv()?`<button class="btn" data-act="upg" data-k="${kind}" data-id="${it.id}" ${has(c)?'':'disabled'}>強化 +${lv}→+${lv+1}（${kind==='w'?'攻撃 '+wStat(it,lv+1):'防御 '+aStat(it,lv+1).def}）</button>`:''}</div>`}
        h+='</div></div></div>'});h+='</div>'};
    h+=`<div class="buildbox"><b>いまのビルド</b>　攻撃 ${atkStat()}　／　パリィ1回で体勢 +${parryGain(false)}pt（強撃 +${parryGain(true)}）　／　回避で体勢 ${dodgeGain()>0?'+'+dodgeGain()+'pt':'なし'}<br>

      const ws0=WEAPONS.filter(w=>S.weapons[w.id]!==undefined||(!w.gacha&&hasAnyMat(w.cost))),ws=ws0.filter(w=>bOK(w.build)).sort(byAtk);
      sec(`— 武器 —`,ws,'w');
      if(!ws.length)h+=`<p class="hint">この系統の武器はまだない。</p>`;
      if(ws0.length<WEAPONS.length)h+=`<p class="hint">ほかにも武器がある。素材を1つでも手に入れると表示される（ボス武器はガチャ限定）。</p>`;
    }else{
    h+=buildTabs('a');
    const sets0=ARMOR_SETS.filter(st=>ARMORS.some(p=>p.set===st&&(S.armors[p.id]!==undefined||hasAnyMat(p.cost)))),sets=sets0.filter(st=>bOK(st.build)).sort(byDef);
    h+=`<div class="sect">— 防具（頭・胴・手・足） —</div><p style="font-size:12px;color:#a89478;margin:-4px 0 10px">シリーズの部位を全部そろえると合計：防御／体力。強化は1段ごとに 防御+1・体力+1。</p>`;
    sets.forEach(st=>{const ps=ARMORS.filter(p=>p.set===st);const rare=!!st.rare||Object.keys(st.perkCost||{}).length>0;

      ps.forEach(it=>{const lv=S.armors[it.id],owned=lv!==undefined,eq=S.eq[it.slot]===it.id,sn=SLOTS.find(x=>x.k===it.slot).n,stt=aStat(it,lv||0);
        h+=`<div class="card prow ${eq?'equipped':''}"><div class="ico"><img src="${armorIcon(it)}"></div><div class="body">
          <div class="pn"><span class="tag">${sn}</span> <b>${it.name}${owned?' +'+lv:''}</b>  <span class="pst">防御 ${stt.def} / 体力 +${stt.hp}</span>${it.perk?` <span class="tag perk" style="opacity:.85">✦ ${perkText(it.perk)}</span>`:''}</div>`;
        if(!owned)h+=`<div class="row">${costChips(it.cost)}<button class="btn mini" data-act="craft" data-k="a" data-id="${it.id}" ${has(it.cost)?'':'disabled'}>作成</button></div>`;

        h+='</div></div>'});
      h+='</div></div>'});
    if(!sets.length)h+=`<p class="hint">この系統の防具はまだない。</p>`;
    if(sets0.length<ARMOR_SETS.length)h+=`<p class="hint">ほかにも防具がある。素材を1つでも手に入れると表示される。</p>`;
    }
  }else if(tab==='gacha'){
    h+=`<div class="card"><p style="margin:0">ボスを倒すと <b>${PROOF_RATE*100}%</b> で「討伐の証」が手に入る。証1つでそのボスのガチャを1回まわせる。<b style="color:#ffe070">ボスラッシュの証</b>なら、どのボスのガチャにも使える。</p>
      <p class="grate" style="margin:6px 0 0">排出率：レア ${GACHA_ODDS.r1*100}%（1〜2個）／激レア ${GACHA_ODDS.r2*100}%（1〜2個）／<b style="color:#ffc0f0">大当たり ${GACHA_ODDS.top*100}%：ボス武器＋超激レア（1〜2個）</b></p></div>`;
    // ★1から順に並べる。ボスを倒す（そのダンジョンを踏破する）までは「???」

      h+=`<div class="card"><h3>${'★'.repeat(D.stars)} ${b.name}のガチャ</h3>

    h+=`<div class="subtabs">${[['w','武器'],['a','防具'],['m','素材']].map(([k,n])=>`<button class="${invTab===k?'on':''}" data-act="itab" data-v="${k}">${n}</button>`).join('')}</div>`;

function tutEvent(ev,ok){if(!TUT||TUT.wait||!B)return;const st=tutCur();

  else if(st.id==='breath'&&ev==='dodge'){TUT.cnt++;B.posture=0}

  else if(st.id==='mix'){const k=st.seq[TUT.seqI];B.posture=0;
    if((k==='heavy'&&ev==='parryHeavy')||(k==='delay'&&ev==='parryDelay')||(k==='combo'&&ev==='flurry'&&ok)){TUT.seqI++;sfx('bonus');float('OK！',W/2,H*0.3,'#9fffc0',34,0.9)}
    else if(k==='combo'&&ev==='flurry')float('おしい！ もう一度',W/2,H*0.3,'#ffd58a',24,1.1);
    if(TUT.seqI>=st.seq.length)tutNext();return}

// 画面の上のほうに、いまのステップと進み具合、はじく向きの矢印
function drawTut(){if(!TUT||B.walk>0)return;const st=tutCur();if(!st)return;
  let goal=st.goal,prog='';
  if(st.need)prog=`${Math.min(TUT.cnt,st.need)} / ${st.need}`;
  if(st.id==='mix'){const nm={heavy:'強撃をはじこう（赤く光る大振り）',delay:'フェイントを待ってからはじこう',combo:'連撃を全部はじこう'};goal=nm[st.seq[Math.min(TUT.seqI,2)]]||'';prog=`${Math.min(TUT.seqI,3)} / 3`}
  if(st.id==='attack'&&B.state==='broken'){goal='敵の体を押したまま、こすって攻撃！';prog=`${TUT.hits} ヒット`}
  const y=HUD_TOP+64,w=Math.min(W-24,420),x=(W-w)/2;
  ctx.save();ctx.fillStyle='rgba(20,13,8,0.88)';ctx.strokeStyle='#c98a3a';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x,y,w,52,12);ctx.fill();ctx.stroke();
  ctx.textAlign='left';ctx.font="700 12px 'M PLUS 1p'";ctx.fillStyle='#c98a3a';ctx.fillText(`チュートリアル ${TUT.step+1}/${TUT_STEPS.length}　${st.title}`,x+12,y+18);
  ctx.font="900 15px 'M PLUS 1p'";ctx.fillStyle='#ffe2ad';ctx.fillText(goal,x+12,y+40);
  if(prog){ctx.textAlign='right';ctx.font="900 18px 'M PLUS 1p'";ctx.fillStyle='#9fffc0';ctx.fillText(prog,x+w-12,y+40)}
  ctx.restore();
  // はじく向きのヒント（チュートリアルだけ）
  const a=B.atk;if(B.state!=='windup'||!a||a.res||a.fail)return;const pp=PC();
  if(a.kind==='breath')return;   // ブレスは元から「〇へ回避」の表示が出る
  if(a.holdLeft>0&&a.t>=a.holdAt){hudText('止まった！ まだ待って…',W/2,H*0.5,"900 22px 'M PLUS 1p'",'#ffd58a');return}
  const v=DV[needDir(a)],ready=a.t>=a.w-earlyWin(),L=Math.min(W,H)*0.16,cx=pp.x,cy=pp.y;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.atan2(v.y,v.x));ctx.globalAlpha=ready?1:0.5;
  ctx.fillStyle=ready?'#fff27a':'#bfe8ff';ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-L*0.6,-L*0.12);ctx.lineTo(L*0.25,-L*0.12);ctx.lineTo(L*0.25,-L*0.3);ctx.lineTo(L*0.7,0);ctx.lineTo(L*0.25,L*0.3);ctx.lineTo(L*0.25,L*0.12);ctx.lineTo(-L*0.6,L*0.12);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore();

// 回避に成功すると INVINCIBLE 秒のあいだ無敵。ただし効くのは「落下物がからむとき」だけ

const INVINCIBLE=0.6;

// ブレス／投擲の着弾点（プレイヤーの左側か右側）と、よけるべき方向
const breathTarget=a=>({x:W/2+(a.side==='L'?-1:1)*Math.min(W*0.22,150),y:H*0.82});
const safeSide=a=>a.side==='L'?'R':'L';
const SIDE_NAME={L:'左',R:'右'};
function drawBreath(){
  const a=B.atk;if(B.state!=='windup'||!a||a.kind!=='breath')return;
  const E=B.E,b=E.breath,h=headScreen(),p=breathTarget(a);

    for(let i=0;i<9;i++){const an=i/9*Math.PI*2,rr=r*(0.8+0.2*Math.sin(i*2.7));ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}ctx.closePath();ctx.fill();ctx.stroke();

// 攻撃が「来る場所」（はじく方向）＝ 振りの逆側。ブレスは口元
function attackPoint(a){
  if(a.kind==='breath')return headScreen();
  const t=B.tf,o=DV[OPP[a.dir]];

        const dbl=E.id==='glacier'&&B.hp<=B.maxHp*0.5?0.5:hz.dbl,tri=isBossFloor()?(hz.tri||0):0,r=Math.random();
        if(r<tri){spawnHazard(0.8);spawnHazard(1.6);float(`${hz.name}が3連続！`,W/2,H*0.3,hz.c,26,1.4)}
        else if(r<tri+dbl){spawnHazard(0.8);float(`${hz.name}が2連続！`,W/2,H*0.3,hz.c,22,1.2)}
        g.hzCD=hzEvery()*rand(0.8,1.2)}}}
  if(E.gimmick==='cold'&&!g.blizzard&&B.hp<=B.maxHp*0.5){g.blizzard=true;sfx('blizzard');fx.flash={c:'#e8f8ff',life:0.5,max:0.5};B.shake=14;
    float('吹雪！ さらに凍える',W/2,H*0.28,'#e8f8ff',30,1.8);float(`${COLD_EVERY}秒ごとに HP -${BLIZZARD_DMG}`,W/2,H*0.28+30,'#bff4ff',18,1.8)}
  // 寒さのダメージ（COLD_EVERY 秒ごと。ボス撃破後・自分が倒れたあとは減らない）
  if(E.gimmick==='cold'&&!B.over){g.coldFlash=Math.max(0,(g.coldFlash||0)-dt*2);g.coldT=(g.coldT||0)+dt;
    if(g.coldT>=COLD_EVERY){g.coldT-=COLD_EVERY;const d=coldDmg()*cutMul();B.php-=d;g.coldFlash=0.6;sfx('chill');
      float(`❄ -${Math.round(d*10)/10}`,W/2+rand(-30,30),H*0.78,'#bff4ff',g.blizzard?24:18,0.8);
      if(B.php<=0){B.php=0;B.over=true;bgm(null);setTimeout(died,900);return}}}
  if(E.gimmick==='armor'&&!g.armorDone&&(B.hp<=B.maxHp*0.6||g.trig)){g.armorDone=true;g.armor=g.armorMax;
    sfx('armor');float('岩鎧をまとった！',W/2,H*0.28,'#d8c8b0',30,1.8);float('体勢崩し3回目で砕ける',W/2,H*0.28+30,'#d8c8b0',18,1.8);B.shake=16;burst(B.tf.x,B.tf.y,'#9a8a78',40,500);cancelBreak()}
  if(E.gimmick==='storm'){
    // HP50%：崩しを強制解除して、すぐ雷速モード（v17）
    if(!g.half&&(B.hp<=B.maxHp*0.5||g.trig)){g.half=true;g.trig=false;cancelBreak();g.charge=0;g.storm=STORM_TIME;fx.flash={c:'#bff4ff',life:0.45,max:0.45};B.shake=20;
      sfx('thunder');sfx('roar');float('雷竜が怒り狂った！',W/2,H*0.26,'#bff4ff',30,1.8);float('雷速モード！ 雷光が走ったら向きが反対に',W/2,H*0.26+30,'#bff4ff',16,1.8);burst(B.tf.x,B.tf.y,'#dff8ff',50,560,true)}
    if(g.storm>0){g.storm-=dt;if(Math.random()<0.6){const t=B.tf;burst(t.x+rand(-1,1)*t.u*0.7,t.y+rand(-1,1)*t.u*0.6,'#dff8ff',1,220,true)}
      if(g.storm<=0){g.storm=0;float('雷速モードが解けた',W/2,H*0.25,'#cdb89a',20,1)}}
    else{const head=B.parts.find(p=>p.id==='head');g.charge=Math.min(1,g.charge+dt/STORM_CHARGE*(head.broken?0.5:1));
      if(g.charge>0.6&&Math.random()<g.charge*0.35){const t=B.tf;burst(t.x+rand(-1,1)*t.u*0.6,t.y+rand(-1,1)*t.u*0.5,'#bff0ff',1,150,true)}
      if(g.charge>=1&&B.state==='idle'){g.charge=0;g.storm=STORM_TIME;fx.flash={c:'#bff4ff',life:0.35,max:0.35};B.roar=0.8;B.shake=12;
        sfx('thunder');float('雷速モード！',W/2,H*0.26,'#bff4ff',32,1.8);float('雷光が走ったら、攻撃の向きが反対になる',W/2,H*0.26+30,'#bff4ff',16,1.8)}}}
  if(E.gimmick==='curse'){
    const core=B.parts.find(p=>p.id==='core');
    if(!core.broken){for(const p of B.parts)if(!p.body&&!p.broken)p.hp=Math.min(p.maxHp,p.hp+p.maxHp*0.004*dt)}
    if(!core.broken&&B.hp<B.maxHp){const r=B.maxHp*0.004*dt;B.hp=Math.min(B.maxHp,B.hp+r);g.regenAcc+=r;
      if(g.regenAcc>=40){const t=B.tf,pt=toScreen(core.x*t.u,core.y*t.u);float('+'+Math.round(g.regenAcc)+' 再生',pt.x+40,pt.y,'#7aff9a',16,0.8);g.regenAcc=0}}
    if(!g.phase2&&(B.hp<=B.maxHp*0.5||g.trig)){g.phase2=true;g.trig=false;cancelBreak();B.E={...B.E,glow:'#ff3050',eye:'#ff2030',bg:['#3a1020','#100408']};
      sfx('roar');float('冥王が真の姿を現した！',W/2,H*0.28,'#ff6a8a',30,2);B.shake=22;burst(B.tf.x,B.tf.y,'#ff3050',60,600,true)}
    // 第二形態（HP50%以下）では反転の呪いがずっと続く。攻撃1発ごと（連撃の1発ずつも）に CURSE_RATE の確率で反転攻撃（紫の輪）
    if(g.phase2&&!(g.curse>0)){g.curse=1;g.curseShow=1.6;sfx('curse');float('反転の呪い！ 紫の輪は逆へはじけ！',W/2,H*0.36,'#d070ff',26,2);fx.flash={c:'#a040ff',life:0.4,max:0.4}}
  }
}
function update(dt){
  if(B.walk>0){B.walk-=dt;B.stepT-=dt;
    if(B.walk>WALK_APPEAR&&B.stepT<=0){B.stepT=0.4;sfx('step')}
    if(!B.appeared&&B.walk<=WALK_APPEAR){B.appeared=true;if(!isBossFloor())sfx('appear')}
    if(B.walk<=0)walkDone();if(!(B.warn>0))return}
  if(B.warn>0){B.warn-=dt;B.shake=Math.max(B.shake,B.warn>WARN_TIME-0.3?8:0);for(const k of['shake'])B[k]=Math.max(0,B[k]-dt*20);
    if(B.warn<=0){B.warn=0;B.timer=WARN_AFTER;B.roar=1.2;B.shake=18;sfx('roar');float(`BOSS ${B.E.name}`,W/2,H*0.53,'#ff7a5a',34,1.6)}return}
  B.t+=dt;
  for(const k of['lunge','recoil','hurt','bounce','dodgeCD','roar','noDodgeT','lockMsg','counterT'])B[k]=Math.max(0,B[k]-dt);
  B.shake=Math.max(0,B.shake-dt*40);
  for(const p of B.parts)p.flash=Math.max(0,p.flash-dt);
  if(B.pAnim){B.pAnim.t+=dt;if(B.pAnim.t>B.pAnim.dur+0.12)B.pAnim=null}
  if(B.dAnim){B.dAnim.t+=dt;if(B.dAnim.t>B.dAnim.dur)B.dAnim=null}
  if(fx.flash){fx.flash.life-=dt;if(fx.flash.life<=0)fx.flash=null}
  if(B.dying)B.fade=Math.max(0,B.fade-dt*0.7);
  // スタミナの回復（最後の回避から少し待つと、1つずつ戻る）
  //   stamWait＝回避直後の待ち時間（このあいだは止まる）、stamP＝回復中の丸のたまり具合（0〜1）
  if(B.stam<STAM_MAX){if(B.stamWait>0)B.stamWait-=dt;else{B.stamP+=dt/STAM_REGEN;if(B.stamP>=1){B.stam++;B.stamP=B.stam<STAM_MAX?B.stamP-1:0}}}
  const a=B.atk;
  const locked=B.noDodgeT>0||!!(B.state==='windup'&&a&&a.noDodge);
  const hzLive=!!(B.hz&&B.hz.some(i=>!i.landed&&i.t>=0)),br=B.state==='windup'&&a&&a.kind==='breath';
  for(const d of['L','R']){const bt=dodgeBtns[d];
    bt.classList.toggle('lock',locked&&!B.over);
    // 光らせるのは「よけるべき側」のボタン。落下物とパリィ失敗はどちらでもよいので両方
    bt.classList.toggle('warn',!locked&&!B.over&&(hzLive||(br&&safeSide(a)===d)||(B.state==='windup'&&a&&a.fail&&a.kind!=='breath')));
    bt.classList.toggle('cd',B.dodgeCD>0);bt.classList.toggle('tired',B.stam<1&&!locked&&!B.over)}
  drawStam();
  if(B.over)return;
  { // 瀕死の鼓動（体力35%未満で、減るほど速く）
    const r=B.php/B.pmax;if(r<0.35&&r>0){B.hb=(B.hb||0)-dt;if(B.hb<=0){sfx('heart');B.hb=60/(70+(0.35-r)*240)}}}
  const n=needNow();if(!TUT&&n>B.lastNeed){B.lastNeed=n;sfx('warn');float(`敵が警戒を強めた！ 必要ポイント +${PT}`,W/2,H*0.2,'#ff9a6a',20,1.6)}
  gimmicks(dt);if(B.over)return;
  if(B.epoison.length){ // ボス武器の毒：敵に1秒ごとダメージ
    for(const p of B.epoison){p.next-=dt;if(p.next<=0&&p.ticks>0){p.next+=1;p.ticks--;const d=Math.max(1,Math.round(pctHp()*G_POISON_PCT*(B.g.armor>0?0.2:1)));B.hp-=d;guardPhase();
      float('毒 '+d,B.tf.x+rand(-40,40),B.tf.y-B.tf.u*0.3,'#b0ff40',20,0.8)}}
    B.epoison=B.epoison.filter(p=>p.ticks>0);if(B.hp<=0&&!B.over){victory();return}}
  if(B.poison.length){ // 毒の継続ダメージ（防御では減らない）
    let d=0;for(const p of B.poison){const k=Math.min(dt,p.left);d+=p.dps*k*cutMul();p.left-=dt}B.poison=B.poison.filter(p=>p.left>0);
    B.php-=d;B.poisonAcc+=d;if(B.poisonAcc>=4){float('-'+Math.round(B.poisonAcc),W/2+rand(-30,30),H*0.78,'#b0ff40',18,0.7);B.poisonAcc=0}
    if(B.php<=0){B.php=0;B.over=true;bgm(null);setTimeout(died,900);return}}
  if(TUT&&tutCur()&&tutCur().id==='hz'&&!B.hz.length&&B.g.hzCD>1.6&&!TUT.wait)B.g.hzCD=1.6;   // チュートリアルの落石は間をあけずに降らす
  if(B.state==='idle'){B.timer-=dt;if(B.timer<=0){if(TUT&&(tutCur().noAtk||TUT.wait))B.timer=0.5;else beginAttack()}}
  else if(B.state==='windup'){
    if(a.holdLeft>0&&a.t>=a.holdAt)a.holdLeft-=dt;else a.t+=dt;
    if(a.warpAt&&!a.warped&&a.t>=a.warpAt){const p0=attackPoint(a);a.warped=true;a.dir=OPP[a.dir];const p1=attackPoint(a),t=B.tf; // 雷光転移：向きが反対へ
      // v17：分かりやすく（太く長い雷光＋空からの雷、元の位置に✕の輪、移った先に「⚡反転！」）
      fx.flash={c:'#e8fbff',life:0.22,max:0.22};fx.zaps.push({a:p0,b:p1,life:0.45,max:0.45,big:true});fx.zaps.push({a:{x:p1.x+rand(-30,30),y:-20},b:p1,life:0.35,max:0.35});
      fx.zaps.push({ghost:true,a:p0,b:p0,life:0.6,max:0.6});a.warpFx=0.6;sfx('zap');setTimeout(()=>sfx('zap'),70);burst(p1.x,p1.y,'#e8fbff',36,520,true);B.shake=Math.max(B.shake,12);
      float('⚡反転！',p1.x,p1.y-64,'#dff8ff',30,0.8)}
    // 冥炎：着弾前から炎を吐く
    if(a.kind==='breath'&&B.E.breath.type==='fire'&&a.t>a.w-Math.min(0.45,a.w*0.75)&&a.t<a.w+0.1){const h=headScreen(),p=breathTarget(a);
      for(let i=0;i<3;i++){const ang=Math.atan2(p.y-h.y,p.x-h.x)+rand(-0.25,0.25),sp=rand(700,1000);fx.parts.push({x:h.x,y:h.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:rand(0.35,0.55),max:0.55,c:Math.random()<0.5?B.E.breath.c:shade(B.E.breath.c,0.4),r:rand(8,18),add:true,round:true,drag:0.97,grav:0})}}
    if(a.kind==='breath'&&B.E.breath.type==='bolt'&&a.t<a.w&&Math.random()<0.5){const h=headScreen();burst(h.x,h.y,'#e8fbff',1,120,true)}
    if(!a.lunged&&a.t>=a.w){a.lunged=true;if(!a.res)impact()}
    if(!a.res&&a.t>=a.w+LATE){resolveHit();if(!B.over)afterResolve()}}
  else if(B.state==='recover'){B.timer-=dt;if(B.timer<=0)nextAttack()}
  else if(B.state==='broken'){B.brokenT-=dt;if(B.brokenT<=0){if(TUT)setTimeout(()=>tutEvent('breakEnd'),0);B.frozenBreak=false;B.posture=0;B.state='idle';B.timer=1.0;B.combo=0;float('体勢を立て直した',W/2,H*0.25,'#cdb89a',20,1)}}
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(B){if(!PAUSED)update(dt);
    ctx.save();if(B.shake>0)ctx.translate((Math.random()-0.5)*B.shake,(Math.random()-0.5)*B.shake);
    if(B.walk>0){drawWalk();ctx.restore();if(B.warn>0)drawWarning();requestAnimationFrame(loop);return}
    drawBG();drawEnemy();drawBreath();drawTelegraph();drawPlayer();if(B.flRow&&B.atk&&B.atk.fl)drawFlurryRow(W/2,B.flRow.y,B.flRow.col);drawHazards();drawFX(dt);drawSpecialFX(dt);ctx.restore();drawOrbs();drawCold();drawLowHP();drawHUD();if(!TUT)drawGimmickHUD();drawTut();if(B.warn>0)drawWarning();
    if(B.g.curse>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'rgba(120,0,200,0)');g.addColorStop(1,'rgba(120,0,200,0.22)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    if(fx.flash){ctx.fillStyle=rgba(fx.flash.c,0.45*fx.flash.life/fx.flash.max);ctx.fillRect(0,0,W,H)}
    if(B.hurt>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,`rgba(220,20,10,${B.hurt})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  }
  requestAnimationFrame(loop);
}
renderHub();requestAnimationFrame(loop);
// 前回ダンジョンの途中でゲームを閉じていたら：倒れたときと同じく装備（装備中の5つから1〜3つ）を失う（ボスラッシュ・テスト挑戦は印を付けないので対象外）
if(S.inRun){const nm=S.inRun.name||'ダンジョン';delete S.inRun;const {n,out:eq}=loseEquipment();renderHub();sfx('death');
  $('#gacha').classList.remove('hidden');$('#gachaBox').innerHTML=(`<h2 style="color:#ff8f7a">探索を放棄した…</h2><p style="color:#ffb0a0;font-weight:700">前回「${nm}」の途中でゲームを終了したため、戦利品と装備${n}つを失った</p>
    <div style="font-size:13px;color:#bba78a">失った装備（装備中の5つからランダムに${n}つ）</div><div class="row" style="opacity:.6;filter:grayscale(.6)">${eq.length?eq.map(o=>`<span class="chip"><img src="${o.i}">${o.t}</span>`).join(''):'<span class="chip" style="padding:3px 8px">なし</span>'}</div>
    <div class="row"><button class="btn" id="lostOk">OK</button></div>`);
  $('#lostOk').onclick=()=>{$('#gacha').classList.add('hidden');renderHub()}}
</script>
