<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>パリィ・ハンター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#120e0b;color:#f1e6d2;font-family:'M PLUS 1p',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
#hub{position:fixed;inset:0;overflow-y:auto;background:radial-gradient(ellipse at 50% -10%,#3b2a1c 0%,#1a120c 55%,#0d0907 100%)}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px}
h1{font-weight:900;font-size:30px;letter-spacing:.06em;text-align:center;color:#ffd58a;text-shadow:0 2px 0 #6b3d10,0 0 18px rgba(255,170,60,.35)}
.sub{text-align:center;font-size:13px;color:#b9a68a;margin:4px 0 18px}
.equip{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:13px;margin-bottom:14px}
.equip span{display:flex;align-items:center;gap:6px;background:#2a1e15;border:1px solid #4d3826;border-radius:24px;padding:3px 12px 3px 4px}
.equip img{width:34px;height:34px}
.equip b{color:#ffd58a}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:11px 0;font:700 15px 'M PLUS 1p';color:#c9b597;background:#24190f;border:1px solid #47331f;border-radius:10px;cursor:pointer}
.tabs button.on{background:linear-gradient(#b9772a,#8a4f15);color:#fff6e0;border-color:#e0a050}
.card{background:linear-gradient(#2b1f15,#211710);border:1px solid #4a3522;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:18px;font-weight:900;color:#ffe2ad;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card p{font-size:13px;color:#bba78a;margin:6px 0}
.card.rare{border-color:#9a6ad0;box-shadow:0 0 14px rgba(160,100,255,.18) inset}
.item{display:flex;gap:14px;align-items:flex-start}
.item .ico{width:84px;height:84px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 40%,#3d2c1e,#160f09);border:1px solid #4a3522;display:flex;align-items:center;justify-content:center}
.item .ico img{width:76px;height:76px}
.item .body{flex:1;min-width:0}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#3d2b1b;color:#e9c690}
.tag.ok{background:#2c4a24;color:#bdf0a8}
.tag.perk{background:#3a2458;color:#e0c0ff}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:#1a120c;border:1px solid #3c2b1c;border-radius:8px;padding:2px 8px 2px 3px}
.chip img{width:22px;height:22px}
.chip.ng{color:#ff8f7a;border-color:#6b2a20}
.chip.r1{border-color:#4a8ad0;color:#bfe0ff}.chip.r2{border-color:#b070ff;color:#e6ccff}.chip.r3{border-color:#ffcf40;color:#fff0b0;box-shadow:0 0 8px rgba(255,200,60,.35)}
.btn{font:700 14px 'M PLUS 1p';padding:9px 18px;border-radius:10px;border:none;cursor:pointer;color:#2a1606;background:linear-gradient(#ffd27a,#e59a2f);box-shadow:0 3px 0 #8a4f15}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a4f15}
.btn.sub2{background:linear-gradient(#5d4a37,#46372a);color:#f1e6d2;box-shadow:0 3px 0 #2a1e14}
.btn:disabled{opacity:.4;cursor:default}
.locked{opacity:.5}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.mat{display:flex;align-items:center;gap:8px;background:#1d140d;border:1px solid #3c2b1c;border-radius:10px;padding:6px 10px 6px 6px;font-size:14px}
.mat img{width:40px;height:40px}
.mat b{margin-left:auto;color:#ffd58a}
.mat.r1{border-color:#4a8ad0}.mat.r2{border-color:#b070ff}.mat.r3{border-color:#ffcf40;box-shadow:0 0 10px rgba(255,200,60,.3)}
.how li{font-size:14px;margin:6px 0 6px 18px;color:#d8c6aa}
.sect{font-size:13px;font-weight:700;color:#e0a050;margin:16px 0 8px;letter-spacing:.1em}
.rt{font-size:12px;color:#a89478;margin-top:8px}
.prow{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #3a2a1c;padding:10px 0 4px;margin-top:8px}
.prow .ico{width:56px;height:56px;flex:none;border-radius:10px;background:radial-gradient(circle at 50% 40%,#3d2c1e,#160f09);border:1px solid #4a3522;display:flex;align-items:center;justify-content:center}
.prow .ico img{width:52px;height:52px}.prow .body{flex:1;min-width:0}.prow .pn{font-size:14px;color:#ffe2ad}.prow .pst{font-size:12px;color:#bba78a;margin-left:4px}
.btn.mini{padding:5px 12px;font-size:12px;box-shadow:0 2px 0 #8a4f15}.btn.sub2.mini{box-shadow:0 2px 0 #2a1e14}
#battle{position:fixed;inset:0;touch-action:none}
#cv{display:block;touch-action:none}
#retreat{position:absolute;left:8px;top:8px;font:700 12px 'M PLUS 1p';padding:5px 10px;border-radius:8px;border:1px solid #6b4a2a;background:rgba(30,20,12,.7);color:#e8d4b4;cursor:pointer}
#dodge{position:absolute;right:16px;bottom:22px;width:84px;height:84px;border-radius:50%;border:3px solid #9fd8ff;background:radial-gradient(circle at 40% 35%,rgba(90,150,200,.55),rgba(20,40,70,.75));color:#e8f6ff;font:900 17px 'M PLUS 1p';cursor:pointer;touch-action:none;box-shadow:0 0 14px rgba(120,200,255,.35)}
#dodge small{display:block;font-size:10px;font-weight:700;opacity:.7}
#dodge.warn{border-color:#ff5a5a;background:radial-gradient(circle at 40% 35%,rgba(255,90,90,.7),rgba(90,10,10,.8));animation:pulse .35s infinite alternate}
#dodge.cd{opacity:.45}
@keyframes pulse{to{transform:scale(1.1);box-shadow:0 0 28px rgba(255,80,80,.8)}}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,5,3,.72)}
#result .box{background:linear-gradient(#2e2116,#1d140d);border:1px solid #7a5530;border-radius:16px;padding:22px 24px;min-width:280px;max-width:92vw;text-align:center}
#result h2{font-size:30px;font-weight:900;margin-bottom:10px}
#result .row{justify-content:center;margin:8px 0 16px}
.rarebanner{font-weight:900;color:#fff0a0;text-shadow:0 0 12px #ffb020;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a2814;border:1px solid #c98a3a;color:#ffe2ad;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:opacity .3s;pointer-events:none;opacity:0;z-index:9}
</style>
</head>
<body>
<div id="hub"><div class="wrap">
  <h1>⚔ パリィ・ハンター</h1>
  <div class="sub">弾いて、崩して、斬り刻め。</div>
  <div class="equip" id="equip"></div>
  <div class="tabs">
    <button data-tab="hunt" class="on">ダンジョン</button>
    <button data-tab="forge">工房</button>
    <button data-tab="mats">素材</button>
    <button data-tab="how">遊び方</button>
  </div>
  <div id="panel"></div>
</div></div>

<div id="battle" class="hidden">
  <canvas id="cv"></canvas>
  <button id="retreat">脱出</button>
  <button id="dodge">回避<small>Shift</small></button>
  <div id="result" class="hidden"><div class="box" id="resultBox"></div></div>
</div>
<div id="toast"></div>

<script>

const RARE_NAME={1:'レア',2:'激レア',3:'超激レア'};

// ===================== 敵 =====================
const ENEMIES=[
  {id:'golm',name:'岩甲獣ゴルム',stars:1,gimmick:'armor',gdesc:'【岩鎧】HPが60%を切ると岩鎧をまとい、与えるダメージが1/5に。岩鎧は形態変化後3回目の体勢崩しで砕け、大ダメージが入る。それまでの2回の崩しは硬い鎧の上から削ることになる。',desc:'鈍重な岩の獣。重い一撃と岩石投げに注意。パリィの練習相手。',
   hp:900,need:[3,5],needEvery:25,breakTime:3.8,windup:1.05,dmg:15,idle:[0.9,1.5],combo:2,
   moves:[['slash',6],['heavy',2],['delay',1],['breath',2]],breath:{type:'rock',name:'岩石投げ',c:'#c89a60'},
   bg:['#4a3826','#20160d'],eye:'#ffb040',glow:'#ff8a30',
   drops:[['bone',3,5],['shell',2,3],['claw',1,1],['hornG',1,1]],
   rares:[['heartstone',0.25],['amber',0.05],['goldhorn',0.005]],
   parts:[
    {id:'body',body:true,x:0,y:0.15,rx:0.78,ry:0.52,c:'#6e5e4c'},
    {id:'back',name:'背甲',x:0,y:-0.1,rx:0.55,ry:0.25,c:'#544638',hp:180,mat:[['shell',2]],deco:'rocks'},
    {id:'legR',name:'右前脚',x:-0.58,y:0.5,rx:0.17,ry:0.28,c:'#5e4f40',hp:140,mat:[['claw',2]],deco:'claws',limb:1},
    {id:'legL',name:'左前脚',x:0.58,y:0.5,rx:0.17,ry:0.28,c:'#5e4f40',hp:140,mat:[['claw',2]],deco:'claws',limb:1},
    {id:'head',name:'岩角',x:0,y:-0.42,rx:0.27,ry:0.22,c:'#8c7b64',hp:170,mat:[['hornG',2]],deco:'horns2',eyes:true},
   ]},
  {id:'volga',name:'雷竜ヴォルガ',stars:2,gimmick:'storm',gdesc:'【雷速モード／雷光転移】雷ゲージが満タンになると12秒間の雷速モード。攻撃が速くなり、振りかぶりの途中で雷光が走ると攻撃の向きが反対側へ入れ替わる。最後まで見てからはじこう。入れ替わった攻撃をパリィすると体勢+1ボーナス。雷角を折るとゲージの溜まりが半分に。',desc:'雷をまとう飛竜。ディレイ攻撃と、パリィ不能の雷ブレスを使う。',
   hp:2600,need:[4,7],needEvery:22,breakTime:3.5,windup:0.85,dmg:28,idle:[0.7,1.3],combo:2,
   moves:[['slash',5],['heavy',2],['delay',2],['breath',2]],breath:{type:'bolt',name:'雷ブレス',c:'#9fe8ff'},
   bg:['#22324e','#0b1120'],eye:'#fff27a',glow:'#7ad0ff',
   drops:[['scale',3,5],['crystal',1,2],['horn',1,1],['wing',1,1],['tail',1,1]],
   rares:[['gekirin',0.15],['thunderorb',0.03],['dragoneye',0.003]],
   parts:[
    {id:'wingR',name:'右翼',x:-0.78,y:-0.18,rx:0.45,ry:0.3,c:'#3e6aa5',hp:400,mat:[['wing',2]],deco:'wing',limb:1},
    {id:'wingL',name:'左翼',x:0.78,y:-0.18,rx:0.45,ry:0.3,c:'#3e6aa5',hp:400,mat:[['wing',2]],deco:'wing',limb:1},

    {id:'body',body:true,x:0,y:0.08,rx:0.45,ry:0.55,c:'#2f5288'},
    {id:'head',name:'雷角',x:0,y:-0.6,rx:0.22,ry:0.2,c:'#3b67a8',hp:380,mat:[['horn',2]],deco:'horn1',eyes:true},
   ]},
  {id:'necros',name:'冥王ネクロス',stars:3,gimmick:'curse',gdesc:'【冥核再生／第二形態／反転の呪い】冥核が無事な間はHPが再生し続ける。HP50%で第二形態になり攻撃がさらに速くなる。第二形態では「反転の呪い」で、紫の輪の攻撃はいつもと逆方向にはじかないとパリィできない。',desc:'冥界の王。素早い3連撃と冥炎。胸の冥核が弱点。',
   hp:5500,need:[5,9],needEvery:20,breakTime:3.3,windup:0.7,dmg:45,idle:[0.6,1.1],combo:3,
   moves:[['slash',5],['heavy',2],['delay',3],['breath',3]],breath:{type:'fire',name:'冥炎',c:'#d070ff'},
   bg:['#2c1a3a','#0b0612'],eye:'#ff4fd8',glow:'#c060ff',
   drops:[['shade',3,5],['soul',2,3],['core',1,1],['crown',1,1]],
   rares:[['soulstone',0.10],['voidcrystal',0.01],['scepter',0.001]],
   parts:[
    {id:'body',body:true,x:0,y:0.1,rx:0.42,ry:0.62,c:'#3a2a4a',deco:'robe'},
    {id:'armR',name:'右腕',x:-0.6,y:0.05,rx:0.2,ry:0.42,c:'#4a3460',hp:800,mat:[['shade',2]],deco:'blade',limb:1},
    {id:'armL',name:'左腕',x:0.6,y:0.05,rx:0.2,ry:0.42,c:'#4a3460',hp:800,mat:[['shade',2]],deco:'blade',limb:1},
    {id:'core',name:'冥核',x:0,y:0.05,rx:0.15,ry:0.15,c:'#b040e0',hp:650,mat:[['core',1],['soul',2]],deco:'core',weak:1.4},
    {id:'head',name:'冥冠',x:0,y:-0.66,rx:0.22,ry:0.21,c:'#d8d0e0',hp:750,mat:[['crown',2]],deco:'crown',eyes:true},
   ]},
];

// ===================== 雑魚（ボスの色違い）とダンジョン =====================
function mixHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function variant(baseId,o){const b=ENEMIES.find(e=>e.id===baseId);
  return {...b,gimmick:null,gdesc:'',...o,minion:true,parts:b.parts.map(p=>({...p,c:mixHex(p.c,o.tint,0.45),hp:p.hp?Math.round(p.hp*o.partMul):undefined}))}}
const MINIONS=[
  variant('golm',{id:'pebble',name:'石ころ獣',tint:'#b0b098',size:0.72,hp:260,need:[2,3],needEvery:25,windup:1.15,dmg:10,combo:1,partMul:0.35,
    moves:[['slash',6],['heavy',1],['breath',1]],breath:{type:'rock',name:'小石投げ',c:'#c8b080'},drops:[['bone',2,3],['shell',1,1]],rares:[['heartstone',0.03]]}),
  variant('golm',{id:'moss',name:'苔岩獣',tint:'#4a8a3a',size:0.85,hp:420,need:[2,4],needEvery:25,windup:1.1,dmg:13,combo:2,partMul:0.5,
    moves:[['slash',6],['heavy',2],['delay',1],['breath',1]],breath:{type:'rock',name:'苔岩投げ',c:'#8ac070'},drops:[['bone',2,3],['shell',1,1],['claw',0,1],['hornG',0,1]],rares:[['amber',0.01]]}),
  variant('volga',{id:'sparkling',name:'雷仔竜',tint:'#3ab0a0',size:0.72,hp:700,need:[3,4],needEvery:22,windup:0.95,dmg:18,combo:1,partMul:0.4,
    moves:[['slash',6],['heavy',1],['delay',1],['breath',1]],breath:{type:'bolt',name:'小雷',c:'#9ff0e0'},drops:[['scale',2,3],['wing',0,1]],rares:[['gekirin',0.03]]}),
  variant('volga',{id:'stormwyv',name:'嵐飛竜',tint:'#7a6ad0',size:0.85,hp:1100,need:[3,5],needEvery:22,windup:0.9,dmg:22,combo:2,partMul:0.55,
    moves:[['slash',5],['heavy',2],['delay',2],['breath',2]],breath:{type:'bolt',name:'嵐のブレス',c:'#c8b8ff'},drops:[['scale',2,3],['crystal',0,1],['tail',0,1]],rares:[['thunderorb',0.005]]}),
  variant('necros',{id:'wraith',name:'亡霊騎士',tint:'#3a7a7a',size:0.8,hp:1600,need:[3,5],needEvery:20,windup:0.8,dmg:30,combo:2,partMul:0.4,
    moves:[['slash',5],['heavy',2],['delay',2],['breath',2]],breath:{type:'fire',name:'怨念の炎',c:'#70e0d0'},drops:[['shade',2,3],['soul',1,1]],rares:[['soulstone',0.02]]}),
  variant('necros',{id:'lich',name:'骸骨魔導士',tint:'#b0a880',size:0.85,hp:2300,need:[4,6],needEvery:20,windup:0.75,dmg:36,combo:3,partMul:0.5,
    moves:[['slash',5],['heavy',2],['delay',3],['breath',3]],breath:{type:'fire',name:'呪炎',c:'#c0ff90'},drops:[['shade',2,3],['soul',1,2],['crown',0,1]],rares:[['voidcrystal',0.003]]}),
];
const FLURRY={golm:[2,3],volga:[3,4],necros:[4,5],pebble:[2,2],moss:[2,3],sparkling:[2,3],stormwyv:[3,4],wraith:[3,4],lich:[3,5]};
for(const e of[...ENEMIES,...MINIONS]){e.flurry=FLURRY[e.id];e.moves=[...e.moves,['combo',e.minion?1.5:2.5]]}
// 敵の体力。部位体力は本体の33%（目安：普通の武器で2か所、狙い続ければ3か所）
const ENEMY_HP={pebble:400,moss:650,golm:1300,sparkling:900,stormwyv:1350,volga:3000,wraith:2000,lich:2600,necros:6000};
const PART_RATIO=0.33;
// 敵の攻撃力：適正防具で通常攻撃1発 ≒ 最大HPの1/3
//  岩窟=岩甲一式+0 / 峡谷=雷鱗一式+0 / 冥界=雷鱗一式+3 を「適正」とした値（雑魚は階層補正込みで同程度）
const ENEMY_DMG={pebble:37,moss:35,golm:40,sparkling:42,stormwyv:40,volga:45,wraith:52,lich:48,necros:55};
for(const e of[...ENEMIES,...MINIONS]){e.dmg=ENEMY_DMG[e.id];e.hp=ENEMY_HP[e.id];e.parts=e.parts.map(p=>p.hp?{...p,hp:Math.round(e.hp*PART_RATIO)}:p)}
const EN=id=>ENEMIES.find(e=>e.id===id)||MINIONS.find(e=>e.id===id);

// ===================== 素材の必要量（ダンジョン踏破回数で決める） =====================
// 1回踏破したときの素材の期待値：全階の討伐ドロップ（平均）＋ 1戦につき部位破壊1か所（部位はランダムとして平均）
const PARTS_PER_FIGHT=1,SLACK=0.85;           // SLACK: 運が悪くても目安回数で届くよう少し少なめに
const WEAPON_CLEARS=2,ARMOR_SET_CLEARS=3;      // 武器＝約2回、防具一式＝約3回
const YIELD=DUNGEONS.map(D=>{const y={};for(const id of D.floors){const E=EN(id);
  for(const[k,a,b]of E.drops)y[k]=(y[k]||0)+(a+b)/2;
  const ps=E.parts.filter(p=>!p.body);for(const p of ps)for(const[k,q]of p.mat)y[k]=(y[k]||0)+q*PARTS_PER_FIGHT/ps.length}
  return y});
function recipe(d,mats,clears,ratio=1){const c={};for(const m of mats)c[m]=Math.max(1,Math.round(clears*YIELD[d][m]*SLACK*ratio));return c}
const TOPMAT=d=>Object.entries(YIELD[d]).sort((a,b)=>b[1]-a[1])[0][0];
const upgRecipe=(d,m,k)=>({[m]:Math.max(1,Math.round(YIELD[d][m]*k))});

function migrate(){ // 旧セーブ（防具1枠）→ 4部位へ
  if(!S.eq){const old=S.armors||{};S.armors={};
    for(const sid in old){if(ARMOR_SETS.find(x=>x.id===sid))for(const sl of SLOTS)S.armors[sid+'_'+sl.k]=old[sid];else if(ARMORS.find(x=>x.id===sid))S.armors[sid]=old[sid]}
    const e=ARMOR_SETS.find(x=>x.id===S.eqA)?S.eqA:'a0';S.eq={};for(const sl of SLOTS){const id=e+'_'+sl.k;S.eq[sl.k]=id;if(S.armors[id]===undefined)S.armors[id]=0}delete S.eqA}
  for(const sl of SLOTS){if(S.armors['a0_'+sl.k]===undefined)S.armors['a0_'+sl.k]=0;if(!S.eq[sl.k])S.eq[sl.k]='a0_'+sl.k}
}

function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt>0?v+(255-v)*amt:v*(1+amt))));return `rgb(${f(r)},${f(g)},${f(b)})`}
function rgba(hex,a){let n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}

// --- 武器の描画（バトル・アイコン共通）。原点=握り、+x方向が刃 ---
function drawSword(c,w,len,s,glow){
  c.save();c.lineJoin='round';c.lineCap='round';
  const long=w.shape==='spear'||w.shape==='vajra';
  c.fillStyle='#4a2a14';c.fillRect(-20*s,-3.5*s,22*s,7*s);
  c.fillStyle=w.shape==='royal'?'#ffe070':'#b88a3a';c.beginPath();c.arc(-21*s,0,4.5*s,0,Math.PI*2);c.fill();
  if(glow){c.shadowColor=w.glow;c.shadowBlur=glow}
  const B=w.blade,E=shade(B,-0.4);c.fillStyle=B;c.strokeStyle=E;c.lineWidth=1.6*s;c.beginPath();
  switch(w.shape){
    case'wood':c.moveTo(4*s,-5*s);c.lineTo(len-8*s,-5*s);c.quadraticCurveTo(len,0,len-8*s,5*s);c.lineTo(4*s,5*s);break;
    case'great':c.moveTo(4*s,-12*s);c.lineTo(len*0.82,-12*s);c.lineTo(len,0);c.lineTo(len*0.82,12*s);c.lineTo(len*0.5,12*s);c.lineTo(len*0.46,7*s);c.lineTo(len*0.42,12*s);c.lineTo(4*s,12*s);break;
    case'katana':c.moveTo(4*s,-3*s);c.quadraticCurveTo(len*0.6,-8*s,len,-15*s);c.quadraticCurveTo(len*0.62,1*s,4*s,4*s);break;
    case'dark':c.moveTo(4*s,-6*s);for(let i=1;i<6;i++)c.lineTo(4*s+(len-4*s)*i/6,-(i%2?13:6)*s);c.lineTo(len,0);for(let i=5;i>0;i--)c.lineTo(4*s+(len-4*s)*i/6,(i%2?6:10)*s);c.lineTo(4*s,6*s);break;
    case'amber':c.moveTo(4*s,-7*s);c.lineTo(len*0.68,-13*s);c.lineTo(len,0);c.lineTo(len*0.68,13*s);c.lineTo(4*s,7*s);break;
    case'royal':c.moveTo(4*s,-8*s);c.lineTo(len*0.9,-5*s);c.lineTo(len*1.04,0);c.lineTo(len*0.9,5*s);c.lineTo(4*s,8*s);break;
    case'spear':case'vajra':{
      c.closePath();c.save();c.shadowBlur=0;c.fillStyle=w.shape==='vajra'?'#c89a30':'#6e4c2a';c.fillRect(0,-3*s,len*0.8,6*s);c.restore();
      c.beginPath();c.fillStyle=B;
      if(w.shape==='spear'){c.moveTo(len*0.74,-9*s);c.lineTo(len*1.06,0);c.lineTo(len*0.74,9*s);c.lineTo(len*0.8,0)}
      else{c.moveTo(len*0.76,-5*s);c.lineTo(len*1.1,0);c.lineTo(len*0.76,5*s);c.closePath();
        for(const sg of[-1,1]){c.moveTo(len*0.76,sg*4*s);c.lineTo(len*0.86,sg*14*s);c.lineTo(len*0.9,sg*8*s);c.lineTo(len*0.98,sg*16*s);c.lineTo(len*0.88,sg*4*s);c.closePath()}}
      break}
  }
  c.closePath();
  if(w.shape==='amber')c.globalAlpha=0.9;
  c.fill();c.stroke();c.globalAlpha=1;c.shadowBlur=0;
  if(w.shape==='amber'||w.shape==='royal'){c.strokeStyle='rgba(255,255,255,0.55)';c.lineWidth=1.2*s;c.beginPath();c.moveTo(6*s,0);c.lineTo(len*0.95,0);c.stroke()}
  if(w.shape==='katana'){c.strokeStyle='rgba(255,255,255,0.7)';c.lineWidth=1*s;c.beginPath();c.moveTo(6*s,0);c.quadraticCurveTo(len*0.6,-4*s,len*0.95,-12*s);c.stroke()}
  if(!long){const gw=w.shape==='great'?18:w.shape==='royal'?15:12;c.fillStyle=w.shape==='royal'?'#ffe070':w.shape==='dark'?'#5a3a80':'#b88a3a';c.fillRect(-1*s,-gw*s,6*s,gw*2*s);
    if(w.shape==='royal'){c.fillStyle='#b040ff';c.beginPath();c.arc(2*s,0,4*s,0,Math.PI*2);c.fill()}}
  c.restore();
}

}
function drawGauntlet(c,a,x,y,s,ang=0){
  const cloth=a.style==='cloth';c.save();c.translate(x,y);c.rotate(ang);
  c.fillStyle=cloth?'#5a3e28':shade(a.color,-0.1);c.beginPath();c.roundRect(-8*s,-26*s,16*s,26*s,4*s);c.fill();

  c.fillStyle=cloth?'#6a4a30':a.style==='gold'?a.trim:shade(a.color,0.15);c.beginPath();c.arc(0,3*s,9*s,0,Math.PI*2);c.fill();
  if(a.style==='cloak'){c.strokeStyle=a.trim;c.lineWidth=1.5*s;c.shadowColor=a.trim;c.shadowBlur=6;c.stroke()}
  c.restore();
}
function drawBody(c,a,x,gy,s,t=0){
  const col=a.color,trim=a.trim;
  const bottom=a.style==='cloak'?gy-28*s:gy-52*s;
  const g=c.createLinearGradient(0,gy-170*s,0,bottom);g.addColorStop(0,shade(col,0.22));g.addColorStop(1,shade(col,-0.45));
  c.fillStyle=g;c.beginPath();c.moveTo(x-38*s,gy-160*s);c.lineTo(x+38*s,gy-160*s);
  if(a.style==='cloak'){const sw=Math.sin(t*3)*4*s;c.lineTo(x+60*s+sw,bottom);for(let i=6;i>=0;i--)c.lineTo(x-60*s+i*20*s+sw,bottom+(i%2?10:0)*s);}
  else{c.lineTo(x+55*s,bottom);c.lineTo(x-55*s,bottom)}
  c.closePath();c.fill();c.strokeStyle=a.style==='cloak'?trim:shade(col,-0.6);c.lineWidth=2;
  if(a.style==='cloak'){c.shadowColor=trim;c.shadowBlur=10}c.stroke();c.shadowBlur=0;
  if(a.style==='scale'){c.strokeStyle=rgba(trim,0.55);c.lineWidth=1.5*s;for(let r=0;r<5;r++)for(let i=-3;i<=3;i++){const yy=gy-145*s+r*18*s,xx=x+i*14*s+(r%2)*7*s;if(Math.abs(xx-x)>36*s+r*4*s)continue;c.beginPath();c.arc(xx,yy,7*s,0.1,Math.PI-0.1);c.stroke()}}
  if(a.style==='plate'||a.style==='gold'){c.fillStyle=trim;c.fillRect(x-46*s,gy-90*s,92*s,8*s);
    c.strokeStyle=rgba('#000000',0.3);c.lineWidth=2*s;c.beginPath();c.moveTo(x,gy-158*s);c.lineTo(x,gy-92*s);c.stroke()}
  if(a.style==='gold'){c.strokeStyle=rgba('#ffffff',0.35);c.lineWidth=4*s;c.beginPath();c.moveTo(x-28*s,gy-150*s);c.lineTo(x-14*s,gy-100*s);c.stroke()}
  if(a.style==='cloth'){c.strokeStyle=trim;c.lineWidth=2*s;c.beginPath();c.moveTo(x-50*s,gy-60*s);c.lineTo(x+50*s,gy-60*s);c.stroke()}
  // 肩
  if(a.style!=='cloth'){for(const sg of[-1,1]){const gr=c.createRadialGradient(x+sg*38*s,gy-164*s,2,x+sg*40*s,gy-158*s,24*s);gr.addColorStop(0,shade(trim,0.3));gr.addColorStop(1,a.style==='cloak'?shade(col,-0.2):shade(trim,-0.35));
    c.fillStyle=gr;c.beginPath();c.ellipse(x+sg*40*s,gy-158*s,22*s,13*s,sg*0.25,0,Math.PI*2);c.fill()}}
}

function startDungeon(i){const D=DUNGEONS[i];const pmax=100+armStat().hp;RUN={i,D,floor:0,loot:{},php:pmax,pmax};startFloor()}
function floorEnemy(){const id=RUN.D.floors[RUN.floor],E=EN(id);if(!E.minion)return E;
  const m=1+0.12*RUN.floor;
  return {...E,hp:Math.round(E.hp*m),dmg:Math.round(E.dmg*(1+0.06*RUN.floor)),parts:E.parts.map(p=>p.hp?{...p,hp:Math.round(p.hp*m)}:p)}}
const isBossFloor=()=>RUN.floor===RUN.D.floors.length-1;
function startFloor(){
  const E=floorEnemy();
  B={E,hp:E.hp,maxHp:E.hp,parts:E.parts.map((p,k)=>({...p,maxHp:p.hp||0,hp:p.hp||0,broken:false,flash:0,seed:k*13+5})),
     posture:0,state:'idle',timer:2.0,atk:null,combo:0,brokenT:0,brokenMax:1,bonus:0,php:RUN.php,pmax:RUN.pmax,loot:{},over:false,
     shake:0,lunge:0,recoil:0,pAnim:null,dAnim:null,hurt:0,t:0,fade:1,tf:{x:0,y:0,rot:0,sc:1,u:1},bounce:0,dodgeAt:-9,dodgeCD:0,lastNeed:0,deathT:0,flurry:null,roar:0,
     g:{charge:0,storm:0,armor:0,armorMax:3,armorDone:false,phase2:false,curse:0,curseCD:5,regenAcc:0}};
  B.lastNeed=needNow();
  fx={parts:[],floats:[],trails:[],slashes:[],bolts:[],zaps:[],icons:[],flash:null};
  $('#hub').classList.add('hidden');$('#battle').classList.remove('hidden');$('#result').classList.add('hidden');
  resize();
  float(`${RUN.D.name}  ${RUN.floor+1}F`,W/2,H*0.46,'#ffd58a',30,1.6);
  float(isBossFloor()?`BOSS ${E.name}`:E.name,W/2,H*0.53,isBossFloor()?'#ff7a5a':'#e8d4b4',isBossFloor()?34:24,1.6);
}
function endToHub(){B=null;RUN=null;$('#battle').classList.add('hidden');$('#hub').classList.remove('hidden');renderHub()}
$('#retreat').onclick=()=>{if(!B)return;if(B.over){if($('#result').classList.contains('hidden'))return;endToHub();return}B.over=true;escapeRun()};
function needNow(){const E=B.E;return Math.max(1,Math.min(E.need[1],E.need[0]+Math.floor(B.t/E.needEvery))+perk('need'))}

function float(t,x,y,c,size=22,life=0.9){fx.floats.push({t,x,y,c,size,life,max:life})}
function burst(x,y,c,n=14,sp=260,add=false){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(sp*0.3,sp);fx.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.25,0.6),max:0.6,c,r:rand(1.5,4),add})}}
function dropIcon(k,x,y,delay=0){fx.icons.push({k,x,y,vx:rand(-120,120),vy:rand(-380,-260),t:-delay,life:1.6})}

// --- 敵の攻撃 ---
function pickMove(){const m=B.E.moves,tot=m.reduce((a,b)=>a+b[1],0);let r=Math.random()*tot;for(const[k,w]of m){if((r-=w)<0)return k}return 'slash'}
const SPD=0.72,IDLE=0.5;   // 攻撃速度・頻度の全体倍率
const OPP={R:'L',L:'R',U:'D',D:'U',UR:'DL',DL:'UR',UL:'DR',DR:'UL'};
function nextAttack(){
  const E=B.E;B.state='idle';
  if(B.flurry){B.timer=0.06;return}
  if(B.combo>0){B.combo--;B.timer=0.16}else{B.combo=ri(0,E.combo);B.timer=rand(E.idle[0],E.idle[1])*IDLE*(B.g.phase2?0.7:1)}
}
function beginAttack(){
  const E=B.E;let kind,dir,w;
  let fl=false;const ph=(B.g.phase2?0.85:1)*(B.g.storm>0?STORM_SPEED:1);
  if(B.flurry){const d=B.flurry.dirs[B.flurry.idx++];fl=true;
    if(d==='B'){kind='breath';dir='D';w=Math.max(0.34,E.windup*SPD*0.5)*ph}else{kind='slash';dir=d;w=Math.max(0.36,E.windup*SPD*0.55)*ph}}
  else{kind=pickMove();w=E.windup*SPD*rand(0.92,1.08)*ph;
    if(kind==='combo'){const n=ri(E.flurry[0],E.flurry[1]);B.flurry={dirs:Array.from({length:n},(_,i)=>i>0&&Math.random()<BREATH_IN_FLURRY?'B':DIRKEYS[ri(0,7)]),idx:1,ok:0,total:n};
      dir=B.flurry.dirs[0];kind='slash';fl=true;w*=1.15}
    else dir=DIRKEYS[ri(0,7)]}
  const a={kind,dir,t:0,w,res:false,fail:false,lunged:false,holdAt:0,holdLeft:0,impactAt:null,fl,cursed:B.g.curse>0&&kind!=='breath'};
  if(kind==='heavy')a.w*=1.4;
  if(kind==='breath'&&!fl)a.w*=BREATH_WINDUP;   // ブレス/投擲は溜めを短く（以前は×1.35）
  if(kind==='delay'){a.holdAt=a.w*rand(0.5,0.68);a.holdLeft=rand(0.3,0.55)}
  B.atk=a;B.state='windup';
  // ヴォルガ：雷速モード中は、振りかぶりの途中で雷光が走って攻撃の向きが反対側へ入れ替わることがある
  //   入れ替わりは受付が始まる前に必ず起きる（前の向きのままでは弾けない）。溜めが短すぎる攻撃では起きない
  if(B.g.storm>0&&kind!=='breath'&&a.w>=0.45&&Math.random()<WARP_CHANCE){a.warpAt=Math.max(0.15,a.w-earlyWin()-rand(0.03,0.1));a.warped=false}
}
const earlyWin=()=>Math.min(0.3,B.atk.w*0.45)*perk('parry');
const needDir=a=>a.cursed?a.dir:OPP[a.dir];   // 攻撃が来た方向へはじき返す（呪い中は逆）
function enterBroken(extra=0){
  B.state='broken';B.brokenMax=B.E.breakTime+B.bonus+extra;B.brokenT=B.brokenMax;B.bonus=0;B.combo=0;
  float('体勢崩し！',W/2,H*0.32,'#ffd04a',46,1.4);B.shake=14;
  // ゴルム：岩鎧は形態変化後3回目の体勢崩しで砕ける
  const g=B.g;if(g.armor>0){g.armor--;const t=B.tf;
    if(g.armor<=0){float('岩鎧が砕けた！',W/2,H*0.24,'#ffd04a',38,1.6);burst(t.x,t.y,'#d8c8b0',70,650);B.shake=22;
      const bonus=atkStat()*3;B.hp-=bonus;float('-'+bonus,t.x,t.y,'#fff',30,1);if(B.hp<=0&&!B.over)victory()}
    else{float(`岩鎧にヒビ！ あと${g.armor}回の崩しで砕ける`,W/2,H*0.24,'#d8c8b0',22,1.4);burst(t.x,t.y,'#b0a090',30,420)}}
}
function afterResolve(){ // 1回の攻撃が終わったあとの共通処理
  const a=B.atk;
  if(a.fl){if(B.flurry.idx>=B.flurry.total){finishFlurry();return}B.state='recover';B.timer=0.05;return}
  if(B.posture>=needNow()){enterBroken();return}
  B.state='recover';B.timer=a.res?0.22:0.3;
}
function finishFlurry(){
  const f=B.flurry;B.flurry=null;
  if(f.ok===f.total&&!f.dodged){B.posture++;float(`${f.total}連撃 見切り！ 体勢+1`,W/2,H*0.26,'#9fe0ff',24,1.3)}
  if(B.posture>=needNow())enterBroken();else{B.state='recover';B.timer=0.3}
}
function tryParry(ang){
  const a=B.atk,c=PC();
  if(a.res||a.fail)return;
  B.pAnim={ang,t:0,dur:0.16};
  if(a.kind==='breath'){a.fail=true;float('パリィ不可！ 回避せよ',c.x,c.y-60,'#ff6a6a',24);return}
  if(a.t<a.w-earlyWin()){a.fail=true;float(a.holdLeft>0||a.kind==='delay'?'ディレイに釣られた！':'早すぎ！',c.x,c.y-60,'#ff8f7a',26);return}
  const nd=needDir(a);
  if(angDiff(ang,DIRS[nd])>30){a.fail=true;float(a.cursed?`呪い！ 逆の${DNAME[nd]}だった`:`向きが違う！（${DNAME[nd]}）`,c.x,c.y-60,'#ff8f7a',24);return}
  a.res=true;const perfect=Math.abs(a.t-a.w)<=PERFECT*perk('parry');
  const gain=a.kind==='heavy'?2:1;B.posture+=gain;if(perfect)B.bonus+=0.6;
  const heal=perk('heal');if(heal){B.php=Math.min(B.pmax,B.php+heal)}
  float((a.kind==='heavy'?'強撃':'')+(perfect?'PERFECT!':'パリィ！'),c.x,c.y-60,perfect?'#fff27a':'#9fe0ff',perfect?40:32,0.9);
  if(gain>1)float('体勢 +2',c.x,c.y-20,'#9fe0ff',20,0.9);
  burst(c.x,c.y,perfect?'#fff27a':'#bfe8ff',perfect?34:20,perfect?440:300,true);
  fx.slashes.push({ang:DIRS[a.dir],life:0.18,max:0.18,c:'#ffffff',parried:true});
  B.recoil=0.3;B.shake=perfect?10:a.kind==='heavy'?9:5;
  if(a.warped){B.posture++;float('雷光転移を見切った！ 体勢+1',c.x,c.y+14,'#bff4ff',20,1.1)}
  if(a.fl)B.flurry.ok++;
  afterResolve();
}
function doDodge(){
  if(!B||B.over||B.dodgeCD>0)return;
  B.dodgeCD=0.45;B.dodgeAt=B.t;B.dAnim={t:0,dur:0.38,side:Math.random()<0.5?-1:1};
}
function impact(){
  const a=B.atk,E=B.E;a.impactAt=B.t;
  if(a.kind==='breath'){const p=PP();
    if(E.breath.type==='bolt')fx.bolts.push({life:0.32,max:0.32});
    if(E.breath.type==='rock')burst(p.x,p.y-40,'#a88058',26,380);
    fx.flash={c:E.breath.c,life:0.25,max:0.25};
  }else{fx.slashes.push({ang:DIRS[a.dir],life:0.24,max:0.24,c:E.glow,heavy:a.kind==='heavy'});B.lunge=0.25}
}
function resolveHit(){
  const a=B.atk;const win=DODGEWIN*perk('dodge');
  if(B.dodgeAt>=a.impactAt-win&&B.dodgeAt<=a.impactAt+LATE){
    // 回避は体勢ポイントを増やさない。連撃中は「⚠ブレス/投擲を回避」だけがさばいた扱いで、普通の攻撃を回避すると連撃ボーナスはなくなる
    if(a.fl&&B.flurry){if(a.kind==='breath')B.flurry.ok++;else{B.flurry.dodged=true;float('回避（体勢は増えない）',W/2,H*0.7+34,'#cdb89a',16,0.9)}}
    float('回避成功！',W/2,H*0.7,'#9fffc0',30,0.9);return}
  const mul=(a.kind==='heavy'?1.6:a.kind==='breath'?1.35:1)*(a.fl?0.6:1);
  const raw=B.E.dmg*mul*rand(0.9,1.1);const def=armStat().def;const dmg=Math.round(raw*100/(100+def));
  B.php-=dmg;B.hurt=0.4;B.shake=a.kind==='heavy'?20:14;B.posture=Math.max(0,B.posture-1);
  float('-'+dmg,W/2,H*0.76,'#ff5a4a',a.kind==='heavy'?40:32,0.9);
  if(B.php<=0){B.php=0;B.over=true;setTimeout(died,900)}
}

// --- プレイヤーの攻撃（こすり） ---
function strike(p,f,x,y,ang){
  let dmg=atkStat()*f*rand(0.9,1.1)*(p.weak&&!p.broken?p.weak:1)*(B.g.armor>0?0.2:1);
  const crit=Math.random()<0.1+perk('crit');if(crit)dmg*=1.8;dmg=Math.max(1,Math.round(dmg));
  B.hp-=dmg;guardPhase();p.flash=0.12;B.bounce=0.1;
  B.pAnim={ang,t:0,dur:0.12};
  float((crit?'会心 ':'')+dmg,x+rand(-14,14),y-10,crit?'#ff6a4a':'#fff',crit?28:20,0.7);
  burst(x,y,crit?'#ff9a6a':'#ffcf8a',crit?14:7,crit?340:220);B.shake=Math.max(B.shake,crit?7:3);
  fx.slashes.push({ang,life:0.14,max:0.14,c:W_(S.eqW).glow,at:{x,y},small:true});
  if(!p.body&&!p.broken){p.hp-=Math.round(dmg*perk('part'));if(p.hp<=0)breakPart(p)}
  if(B.hp<=0&&!B.over)victory();
}
function breakPart(p){
  p.broken=true;p.hp=0;const bonus=atkStat()*2;B.hp-=bonus;guardPhase();
  const t=B.tf,pt=toScreen(p.x*t.u,p.y*t.u);
  burst(pt.x,pt.y,'#ffe08a',40,520,true);B.shake=16;
  p.mat.forEach(([k,q],i)=>{B.loot[k]=(B.loot[k]||0)+q;for(let j=0;j<Math.min(q,3);j++)dropIcon(k,pt.x,pt.y,i*0.1+j*0.06)});
  float(`${p.name} 破壊！`,pt.x,pt.y-30,'#ffd04a',34,1.4);
  float(p.mat.map(([k,q])=>`${MATS[k].n}×${q}`).join('  ')+' 獲得',pt.x,pt.y+10,'#bdf0a8',20,1.6);
}
function victory(){
  B.over=true;B.hp=0;B.dying=true;const drops={},rares={};
  B.E.drops.forEach(([k,a,b])=>{const n=ri(a,b);if(n>0){drops[k]=n;B.loot[k]=(B.loot[k]||0)+n}});
  B.E.rares.forEach(([k,p])=>{if(Math.random()<p){rares[k]=1;B.loot[k]=(B.loot[k]||0)+1}});
  const t=B.tf;burst(t.x,t.y,B.E.glow,70,650,true);
  let d=0;for(const k in drops){dropIcon(k,t.x,t.y,0.5+d);d+=0.08}
  const rk=Object.keys(rares);
  rk.forEach((k,i)=>{dropIcon(k,t.x,t.y,0.9+i*0.15);setTimeout(()=>{float(`${RARE_NAME[MATS[k].rare]}ドロップ！ ${MATS[k].n}`,W/2,H*0.45+i*44,'#fff0a0',30,1.6);burst(W/2,H*0.45+i*44,'#ffe070',40,500,true)},900+i*300)});
  setTimeout(()=>floorCleared(rares),1700+rk.length*300);
}
const lootChips=o=>{const e=Object.entries(o);return e.length?e.sort((a,b)=>(MATS[b[0]].rare||0)-(MATS[a[0]].rare||0)).map(([k,q])=>chip(k,`${MATS[k].n} ×${q}`)).join(''):'<span class="chip" style="padding:3px 8px">なし</span>'};
function addLoot(dst,src){for(const k in src)dst[k]=(dst[k]||0)+src[k]}
function bankRun(){for(const k in RUN.loot)addMat(k,RUN.loot[k]);save()}
function showBox(html){$('#resultBox').innerHTML=html;$('#result').classList.remove('hidden')}
function floorCleared(rares){
  addLoot(RUN.loot,B.loot);RUN.php=B.php;
  const rk=Object.keys(rares);
  const rareHtml=rk.length?`<div class="rarebanner">✦ レアドロップ ✦</div><div class="row">${rk.map(k=>chip(k,`${MATS[k].n}（${RARE_NAME[MATS[k].rare]}）`)).join('')}</div>`:'';
  if(isBossFloor()){
    bankRun();const D=RUN.D,first=!S.cleared[D.id];S.cleared[D.id]=true;save();
    const next=DUNGEONS[RUN.i+1];
    showBox(`<h2 style="color:#ffd58a">ダンジョン踏破！</h2>${rareHtml}
      <div style="font-size:13px;color:#bba78a">持ち帰った戦利品</div><div class="row">${lootChips(RUN.loot)}</div>
      ${first&&next?`<p style="color:#bdf0a8;font-weight:700;margin-bottom:14px">新ダンジョン「${next.name}」が解放された！</p>`:''}
      <div class="row"><button class="btn" id="home">拠点へ戻る</button></div>`);
    $('#home').onclick=endToHub;return;
  }
  const heal=Math.round(RUN.pmax*0.05);
  showBox(`<h2 style="color:#ffd58a">${RUN.floor+1}F 突破！</h2>${rareHtml}
    <div style="font-size:13px;color:#bba78a">この階の戦利品</div><div class="row">${lootChips(B.loot)}</div>
    <div style="font-size:13px;color:#ffb0a0">未確定の戦利品（倒れると失う）</div><div class="row">${lootChips(RUN.loot)}</div>
    <p style="font-size:14px;margin-bottom:6px">HP ${Math.ceil(RUN.php)} / ${RUN.pmax}　次は <b>${RUN.floor+2}F ${isLast2()?'BOSS ':''}${EN(RUN.D.floors[RUN.floor+1]).name}</b></p>
    <div class="row"><button class="btn sub2" id="goHome">帰還する（持ち帰る）</button><button class="btn" id="goNext">次の階へ（HP+${heal}）</button></div>`);
  $('#goHome').onclick=()=>{bankRun();showBox(`<h2 style="color:#bdf0a8">無事に帰還した</h2><div style="font-size:13px;color:#bba78a">持ち帰った戦利品</div><div class="row">${lootChips(RUN.loot)}</div><div class="row"><button class="btn" id="home">拠点へ戻る</button></div>`);$('#home').onclick=endToHub};
  $('#goNext').onclick=()=>{RUN.php=Math.min(RUN.pmax,RUN.php+heal);RUN.floor++;startFloor()};
}
const isLast2=()=>RUN.floor+1===RUN.D.floors.length-1;
function loseEquipment(){
  const out=[];const w=W_(S.eqW);
  if(S.eqW==='w0'){if(S.weapons.w0>0)out.push({t:`${w.name}+${S.weapons.w0} → +0`,i:weaponIcon(w)});S.weapons.w0=0}
  else{out.push({t:`${w.name}+${S.weapons[S.eqW]}`,i:weaponIcon(w)});delete S.weapons[S.eqW];S.eqW='w0';if(S.weapons.w0===undefined)S.weapons.w0=0}
  for(const sl of SLOTS){const p=A_(S.eq[sl.k]),lv=S.armors[p.id]||0;
    if(p.set.id==='a0'){if(lv>0)out.push({t:`${p.name}+${lv} → +0`,i:armorIcon(p)});S.armors[p.id]=0}
    else{out.push({t:`${p.name}+${lv}`,i:armorIcon(p)});delete S.armors[p.id];S.eq[sl.k]='a0_'+sl.k;if(S.armors['a0_'+sl.k]===undefined)S.armors['a0_'+sl.k]=0}}
  save();return out;
}
function died(){
  const lost={};addLoot(lost,RUN.loot);addLoot(lost,B.loot);const eq=loseEquipment();
  showBox(`<h2 style="color:#ff8f7a">力尽きた…</h2><p style="color:#ffb0a0;font-weight:700">${RUN.D.name} ${RUN.floor+1}F で倒れ、装備と戦利品をすべて失った</p>
    <div style="font-size:13px;color:#bba78a">失った装備</div><div class="row" style="opacity:.6;filter:grayscale(.6)">${eq.length?eq.map(o=>`<span class="chip"><img src="${o.i}">${o.t}</span>`).join(''):'<span class="chip" style="padding:3px 8px">なし</span>'}</div>
    <div style="font-size:13px;color:#bba78a">失った戦利品</div><div class="row" style="opacity:.6;filter:grayscale(.6)">${lootChips(lost)}</div>
    <div class="row"><button class="btn" id="home">拠点へ戻る</button></div>`);
  $('#home').onclick=endToHub;
}
function escapeRun(){
  bankRun();
  showBox(`<h2 style="color:#e8d4b4">脱出した</h2><p style="font-size:13px;color:#ffb0a0">この階（${RUN.floor+1}F）で得た戦利品は置いてきた</p>
    <div style="font-size:13px;color:#bba78a">持ち帰った戦利品（${RUN.floor}F までの分）</div><div class="row">${lootChips(RUN.loot)}</div>
    <div class="row"><button class="btn" id="home">拠点へ戻る</button></div>`);
  $('#home').onclick=endToHub;
}

// --- 入力 ---
let ptr=null;
cv.addEventListener('pointerdown',e=>{if(!B)return;const now=performance.now();
  ptr={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,t:now,acc:0,lastHit:now-RUBCD,accT:now,used:false,pts:[{x:e.clientX,y:e.clientY}],blocked:false};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!ptr||!B)return;const now=performance.now(),x=e.clientX,y=e.clientY;
  const seg=Math.hypot(x-ptr.lx,y-ptr.ly);ptr.pts.push({x,y});if(ptr.pts.length>24)ptr.pts.shift();
  if(B.state==='broken'&&!B.over){
    ptr.acc+=seg;
    if(seg>2)fx.trails.push({pts:[{x:ptr.lx,y:ptr.ly},{x,y}],life:0.22,max:0.22,c:'#ffe0a0'});
    if(ptr.acc>=RUB&&now-ptr.lastHit>=RUBCD){
      const p=hitTest(x,y);
      if(p){const speed=ptr.acc/Math.max(0.03,(now-ptr.accT)/1000);const f=0.3+Math.min(0.4,speed/5000);
        strike(p,f,x,y,Math.atan2(y-ptr.ly,x-ptr.lx)*180/Math.PI)}
      ptr.acc=0;ptr.lastHit=now;ptr.accT=now;
    }
  }else if(!ptr.used){
    const dx=x-ptr.sx,dy=y-ptr.sy;
    if(Math.hypot(dx,dy)>=45){ptr.used=true;gesture(dx,dy)}
  }
  ptr.lx=x;ptr.ly=y});
cv.addEventListener('pointerup',e=>{if(!ptr)return;const p=ptr;ptr=null;if(!B)return;

function toScreen(x,y){const t=B.tf,c=Math.cos(t.rot),s=Math.sin(t.rot);x*=t.sc;y*=t.sc;return {x:t.x+x*c-y*s,y:t.y+x*s+y*c}}
function hitTest(px,py){
  const t=B.tf;let dx=px-t.x,dy=py-t.y;const c=Math.cos(-t.rot),s=Math.sin(-t.rot);
  let x=(dx*c-dy*s)/t.sc,y=(dx*s+dy*c)/t.sc;
  for(let i=B.parts.length-1;i>=0;i--){const p=B.parts[i];const k=p.broken?0.85:1;
    const nx=(x-p.x*t.u)/(p.rx*t.u*k*1.15),ny=(y-p.y*t.u)/(p.ry*t.u*k*1.15);if(nx*nx+ny*ny<=1)return p}
  return null;
}

// --- 岩窟の迷宮：奥へ続く洞窟。手前ほど暗い岩のアーチ、つらら石と石筍、壁のたいまつ

// --- 雷鳴の峡谷：嵐の空、両側にそびえる断崖（奥ほど青くかすむ）、谷底の道

function warnIcon(x,y,sz,col){ctx.save();ctx.fillStyle=col;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y-sz*0.45);ctx.lineTo(x+sz*0.48,y+sz*0.38);ctx.lineTo(x-sz*0.48,y+sz*0.38);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#200';ctx.font=`900 ${Math.round(sz*0.5)}px 'M PLUS 1p'`;ctx.textAlign='center';ctx.fillText('!',x,y+sz*0.3);ctx.restore()}
function drawFlurryRow(cx,yy,col){ // 連撃の並び（⚠はブレス／投擲）
  if(!B.flurry)return;const f=B.flurry,n=f.total,sz=30,gap=38,x0=cx-(n-1)*gap/2;
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.roundRect(x0-sz/2-10,yy-sz/2-8,(n-1)*gap+sz+20,sz+16,10);ctx.fill();
  for(let i=0;i<n;i++){const cur=i===f.idx-1,done=i<f.idx-1,d=f.dirs[i];ctx.globalAlpha=done?0.3:1;
    if(cur){ctx.fillStyle='rgba(255,233,74,0.25)';ctx.fillRect(x0+i*gap-sz/2-3,yy-sz/2-3,sz+6,sz+6)}
    if(d==='B')warnIcon(x0+i*gap,yy,cur?sz:sz*0.8,cur?col:'#ff3a3a');else{ctx.fillStyle=cur?col:'#ff8a3a';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x0+i*gap,yy,(cur?sz:sz*0.8)*0.32,0,Math.PI*2);ctx.fill();ctx.stroke()}}
  ctx.globalAlpha=1}

function swordAngle(){
  if(!B.pAnim)return -66;
  const a=B.pAnim,k=ease(Math.min(1,a.t/a.dur));const to=a.ang,from=to+180;
  // 上側を通るように回す
  const mid1=from+90,mid2=from-90;const d1=angDiff(mid1,-90),d2=angDiff(mid2,-90);
  const delta=d1<d2?-180:180;return from+delta*k;
}
function drawPlayer(){
  const s=Math.min(1,H/900,W/480),gy=H*0.99,a=eqSets(),w=W_(S.eqW);
  let x=W/2;
  if(B.dAnim){const k=Math.min(1,B.dAnim.t/B.dAnim.dur);const off=B.dAnim.side*Math.sin(k*Math.PI)*110*s;
    for(let i=1;i<=2;i++){ctx.save();ctx.globalAlpha=0.18*i;drawPlayerAt(x+off*(i/3),gy,s,a,w);ctx.restore()}x+=off}
  if(B.hurt>0)x+=(Math.random()-0.5)*10;
  drawPlayerAt(x,gy+(B.hurt>0?B.hurt*20:0),s,a,w);
}
function drawPlayerAt(x,gy,s,a,w){
  ctx.fillStyle='rgba(0,0,0,0.45)';ell(x,gy-4*s,70*s,14*s);ctx.fill();
  const br=Math.sin(B.t*2.5)*2*s;
  drawLegs(ctx,a.legs,x,gy,s);
  drawBody(ctx,a.body,x,gy+br*0.3,s,B.t);
  const pv={x:x+30*s,y:gy-130*s+br};const ang=swordAngle()*Math.PI/180;
  const hc=a.hands.style==='cloth'?shade(a.body.color,-0.2):shade(a.hands.color,-0.15);
  ctx.strokeStyle=hc;ctx.lineWidth=14*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+30*s,gy-150*s);ctx.lineTo(pv.x,pv.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-30*s,gy-150*s);ctx.lineTo(x-42*s,gy-105*s);ctx.stroke();
  drawGauntlet(ctx,a.hands,x-42*s,gy-100*s,s*0.8,0.25);
  ctx.save();ctx.translate(pv.x,pv.y);ctx.rotate(ang);drawSword(ctx,w,swordLen(w)*s,s,B.pAnim?28:(B.state==='broken'?18:8));ctx.restore();
  ctx.fillStyle=a.hands.style==='cloth'?'#6a4a30':a.hands.style==='gold'?a.hands.trim:shade(a.hands.color,0.15);ctx.beginPath();ctx.arc(pv.x,pv.y,8*s,0,Math.PI*2);ctx.fill();
  drawHead(ctx,a.head,x,gy+br,s);
}

function bar(x,y,w,h,r,c,bg='rgba(0,0,0,0.55)'){ctx.fillStyle=bg;ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle=c;ctx.fillRect(x,y,w*Math.max(0,r),h)}
function drawHUD(){
  const E=B.E,bw=Math.min(W*0.62,520),bx=(W-bw)/2;
  ctx.textAlign='center';ctx.fillStyle='#ffe2ad';ctx.font="900 16px 'M PLUS 1p'";ctx.fillText(E.name,W/2,24);
  bar(bx,32,bw,10,B.hp/B.maxHp,'#d8402a');
  if(B.state==='broken'){bar(bx,50,bw,8,B.brokenT/B.brokenMax,'#ffcc3a');ctx.fillStyle='#ffd04a';ctx.font="900 15px 'M PLUS 1p'";ctx.fillText('体勢崩し中！ 部位を押したまま こすって攻撃',W/2,80)}
  else{const n=needNow(),sp=Math.min(26,(bw-40)/n),sx=W/2-(n-1)*sp/2;ctx.font="700 12px 'M PLUS 1p'";ctx.fillStyle='#cdb89a';ctx.textAlign='right';ctx.fillText('体勢',sx-14,58);ctx.textAlign='center';
    for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(sx+i*sp,54,Math.min(8,sp*0.35),0,Math.PI*2);ctx.fillStyle=i<B.posture?'#9fe0ff':'rgba(255,255,255,0.12)';ctx.fill();ctx.strokeStyle='#6a8aa0';ctx.lineWidth=1.5;ctx.stroke()}
    if(n<E.need[1]+perk('need')){const left=E.needEvery-(B.t%E.needEvery);ctx.fillStyle='#a89478';ctx.font="700 11px 'M PLUS 1p'";ctx.fillText(`${Math.ceil(left)}秒後に必要回数+1（最大${Math.max(1,E.need[1]+perk('need'))}）`,W/2,76)}
    if(B.bonus>0){ctx.fillStyle='#fff27a';ctx.font="700 12px 'M PLUS 1p'";ctx.fillText(`崩し時間 +${B.bonus.toFixed(1)}秒`,W/2,92)}}
  if(RUN){ctx.textAlign='left';ctx.font="700 12px 'M PLUS 1p'";ctx.fillStyle='#e8d4b4';ctx.fillText(`${RUN.D.name}`,10,52);
    ctx.fillStyle=isBossFloor()?'#ff8a6a':'#ffd58a';ctx.font="900 15px 'M PLUS 1p'";ctx.fillText(`${RUN.floor+1}F / ${RUN.D.floors.length}F${isBossFloor()?' BOSS':''}`,10,70);
    const n=Object.values(RUN.loot).reduce((a,b)=>a+b,0)+Object.values(B.loot).reduce((a,b)=>a+b,0);ctx.fillStyle='#ffb0a0';ctx.font="700 11px 'M PLUS 1p'";ctx.fillText(`未確定の戦利品 ${n}個`,10,86)}
  const pw=Math.min(W*0.4,240);ctx.textAlign='left';ctx.fillStyle='#e8d4b4';ctx.font="700 12px 'M PLUS 1p'";ctx.fillText(`HP ${Math.ceil(B.php)} / ${B.pmax}`,12,H-26);
  bar(12,H-18,pw,8,B.php/B.pmax,B.php/B.pmax<0.3?'#ff5a4a':'#5ad06a');
}

function drawFX(dt){
  const c=PC();
  // 敵の斬撃エフェクト
  for(const sl of fx.slashes){sl.life-=dt;const k=1-sl.life/sl.max,al=sl.life/sl.max;
    ctx.save();const o=sl.at||c;ctx.translate(o.x,o.y);ctx.rotate(sl.ang*Math.PI/180);ctx.globalAlpha=al;
    const L=sl.small?60:Math.min(W*0.45,300)*(sl.heavy?1.25:1);ctx.strokeStyle=sl.c;ctx.shadowColor=sl.c;ctx.shadowBlur=20;
    ctx.lineWidth=(sl.small?6:sl.heavy?26:16)*al+2;ctx.lineCap='round';
    const sw=Math.min(1,k*3);ctx.beginPath();ctx.moveTo(-L,-L*0.2);ctx.quadraticCurveTo(0,L*0.3,L,-L*0.2);ctx.setLineDash([L*2.6*sw,L*3]);ctx.stroke();ctx.setLineDash([]);
    ctx.lineWidth=(sl.small?2:5)*al;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore()}
  fx.slashes=fx.slashes.filter(s=>s.life>0);
  // 雷
  for(const b of fx.bolts){b.life-=dt;const h=headScreen(),p=PP(),al=b.life/b.max;ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='#e8fbff';ctx.shadowColor='#7ad0ff';ctx.shadowBlur=30;
    for(let j=0;j<3;j++){ctx.lineWidth=j?2:6;ctx.beginPath();ctx.moveTo(h.x,h.y);for(let i=1;i<=8;i++){const t=i/8;ctx.lineTo(h.x+(p.x-h.x)*t+(i<8?rand(-40,40):rand(-60,60)),h.y+(p.y-h.y)*t)}ctx.stroke()}ctx.restore()}
  fx.bolts=fx.bolts.filter(b=>b.life>0);
  for(const z of fx.zaps){z.life-=dt;const al=Math.max(0,z.life/z.max);ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='#f2fdff';ctx.shadowColor='#8fe0ff';ctx.shadowBlur=24;ctx.lineCap='round';
    for(let j=0;j<2;j++){ctx.lineWidth=j?2:6;ctx.beginPath();ctx.moveTo(z.a.x,z.a.y);for(let i=1;i<10;i++){const k=i/10;ctx.lineTo(z.a.x+(z.b.x-z.a.x)*k+rand(-26,26),z.a.y+(z.b.y-z.a.y)*k+rand(-26,26))}ctx.lineTo(z.b.x,z.b.y);ctx.stroke()}ctx.restore()}
  fx.zaps=fx.zaps.filter(z=>z.life>0);
  // パーティクル
  for(const p of fx.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=p.drag||0.92;p.vy=p.vy*(p.drag||0.92)+(p.grav!=null?p.grav:300)*dt;
    ctx.globalAlpha=Math.max(0,p.life/p.max);if(p.add)ctx.globalCompositeOperation='lighter';ctx.fillStyle=p.c;
    if(p.round){ctx.beginPath();ctx.arc(p.x,p.y,p.r*(0.5+p.life/p.max),0,Math.PI*2);ctx.fill()}else ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
    ctx.globalCompositeOperation='source-over'}
  ctx.globalAlpha=1;fx.parts=fx.parts.filter(p=>p.life>0);
  // スワイプの軌跡
  for(const t of fx.trails){t.life-=dt;const a=t.life/t.max;ctx.strokeStyle=t.c;ctx.globalAlpha=a;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=10*a+2;ctx.shadowColor=t.c;ctx.shadowBlur=16;ctx.beginPath();t.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
  ctx.shadowBlur=0;ctx.globalAlpha=1;fx.trails=fx.trails.filter(t=>t.life>0);
  // 素材アイコン
  for(const ic of fx.icons){ic.t+=dt;if(ic.t<0)continue;ic.x+=ic.vx*dt;ic.y+=ic.vy*dt;ic.vy+=700*dt;if(ic.y>H*0.62&&ic.vy>0){ic.vy*=-0.45;ic.vx*=0.6;ic.y=H*0.62}
    const al=Math.min(1,(ic.life-ic.t)*2),sz=MATS[ic.k].rare?54:40;ctx.globalAlpha=Math.max(0,al);
    if(MATS[ic.k].rare){ctx.save();ctx.translate(ic.x,ic.y);ctx.rotate(B.t*2);ctx.strokeStyle='#ffe070';ctx.lineWidth=2;for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(sz*0.5,0);ctx.lineTo(sz*0.85,0);ctx.stroke()}ctx.restore()}
    if(IMG[ic.k].complete)ctx.drawImage(IMG[ic.k],ic.x-sz/2,ic.y-sz/2,sz,sz)}
  ctx.globalAlpha=1;fx.icons=fx.icons.filter(i=>i.t<i.life);
  // 文字
  ctx.textAlign='center';
  for(const f of fx.floats){f.life-=dt;f.y-=30*dt;const a=Math.min(1,f.life/f.max*2.5);ctx.globalAlpha=Math.max(0,a);ctx.font=`900 ${f.size}px 'M PLUS 1p'`;
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,0.75)';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)}
  ctx.globalAlpha=1;fx.floats=fx.floats.filter(f=>f.life>0);
}

function guardPhase(){ // 形態変化・岩鎧の境目を一撃で飛び越えさせない
  const E=B.E,g=B.g;
  if(E.gimmick==='curse'&&!g.phase2&&B.hp<=B.maxHp*0.5){B.hp=B.maxHp*0.5;g.trig=true}
  if(E.gimmick==='armor'&&!g.armorDone&&B.hp<=B.maxHp*0.6){B.hp=B.maxHp*0.6;g.trig=true}
}
function cancelBreak(msg){
  if(B.state==='broken')float(msg||'崩しが解除された！',W/2,H*0.34,'#ff9a6a',24,1.6);
  B.posture=0;B.bonus=0;B.flurry=null;B.combo=0;B.state='idle';B.timer=1.4;B.roar=1.2;ptr&&(ptr.acc=0);
}
function gimmicks(dt){
  const E=B.E,g=B.g;
  if(E.gimmick==='armor'&&!g.armorDone&&(B.hp<=B.maxHp*0.6||g.trig)){g.armorDone=true;g.armor=g.armorMax;
    float('岩鎧をまとった！',W/2,H*0.28,'#d8c8b0',30,1.8);float('体勢崩し3回目で砕ける',W/2,H*0.28+30,'#d8c8b0',18,1.8);B.shake=16;burst(B.tf.x,B.tf.y,'#9a8a78',40,500);cancelBreak()}
  if(E.gimmick==='storm'){
    if(g.storm>0){g.storm-=dt;if(Math.random()<0.6){const t=B.tf;burst(t.x+rand(-1,1)*t.u*0.7,t.y+rand(-1,1)*t.u*0.6,'#dff8ff',1,220,true)}
      if(g.storm<=0){g.storm=0;float('雷速モードが解けた',W/2,H*0.25,'#cdb89a',20,1)}}
    else{const head=B.parts.find(p=>p.id==='head');g.charge=Math.min(1,g.charge+dt/STORM_CHARGE*(head.broken?0.5:1));
      if(g.charge>0.6&&Math.random()<g.charge*0.35){const t=B.tf;burst(t.x+rand(-1,1)*t.u*0.6,t.y+rand(-1,1)*t.u*0.5,'#bff0ff',1,150,true)}
      if(g.charge>=1&&B.state==='idle'){g.charge=0;g.storm=STORM_TIME;fx.flash={c:'#bff4ff',life:0.35,max:0.35};B.roar=0.8;B.shake=12;
        float('雷速モード！',W/2,H*0.26,'#bff4ff',32,1.8);float('雷光が走ったら、攻撃の向きが反対になる',W/2,H*0.26+30,'#bff4ff',16,1.8)}}}
  if(E.gimmick==='curse'){
    const core=B.parts.find(p=>p.id==='core');
    if(!core.broken){for(const p of B.parts)if(!p.body&&!p.broken)p.hp=Math.min(p.maxHp,p.hp+p.maxHp*0.004*dt)}
    if(!core.broken&&B.hp<B.maxHp){const r=B.maxHp*0.004*dt;B.hp=Math.min(B.maxHp,B.hp+r);g.regenAcc+=r;
      if(g.regenAcc>=40){const t=B.tf,pt=toScreen(core.x*t.u,core.y*t.u);float('+'+Math.round(g.regenAcc)+' 再生',pt.x+40,pt.y,'#7aff9a',16,0.8);g.regenAcc=0}}
    if(!g.phase2&&(B.hp<=B.maxHp*0.5||g.trig)){g.phase2=true;g.trig=false;cancelBreak();B.E={...B.E,glow:'#ff3050',eye:'#ff2030',bg:['#3a1020','#100408']};
      float('冥王が真の姿を現した！',W/2,H*0.28,'#ff6a8a',30,2);B.shake=22;burst(B.tf.x,B.tf.y,'#ff3050',60,600,true)}
    if(g.phase2){if(g.curse>0){g.curse-=dt;if(g.curse<=0)float('呪いが解けた',W/2,H*0.25,'#cdb89a',20,1)}
      else{g.curseCD-=dt;if(g.curseCD<=0){g.curse=8;g.curseCD=14;float('反転の呪い！ 紫の輪は逆へはじけ！',W/2,H*0.25,'#d070ff',26,1.8);fx.flash={c:'#a040ff',life:0.4,max:0.4}}}}
  }
}
function update(dt){
  B.t+=dt;
  for(const k of['lunge','recoil','hurt','bounce','dodgeCD','roar'])B[k]=Math.max(0,B[k]-dt);
  B.shake=Math.max(0,B.shake-dt*40);
  for(const p of B.parts)p.flash=Math.max(0,p.flash-dt);
  if(B.pAnim){B.pAnim.t+=dt;if(B.pAnim.t>B.pAnim.dur+0.12)B.pAnim=null}
  if(B.dAnim){B.dAnim.t+=dt;if(B.dAnim.t>B.dAnim.dur)B.dAnim=null}
  if(fx.flash){fx.flash.life-=dt;if(fx.flash.life<=0)fx.flash=null}
  if(B.dying)B.fade=Math.max(0,B.fade-dt*0.7);
  const a=B.atk;
  dodgeBtn.classList.toggle('warn',!!(B.state==='windup'&&a&&(a.kind==='breath'||a.fail)&&!B.over));
  dodgeBtn.classList.toggle('cd',B.dodgeCD>0);
  if(B.over)return;
  const n=needNow();if(n>B.lastNeed){B.lastNeed=n;float('敵が警戒を強めた！ 必要パリィ +1',W/2,H*0.2,'#ff9a6a',20,1.6)}
  gimmicks(dt);if(B.over)return;
  if(B.state==='idle'){B.timer-=dt;if(B.timer<=0)beginAttack()}
  else if(B.state==='windup'){
    if(a.holdLeft>0&&a.t>=a.holdAt)a.holdLeft-=dt;else a.t+=dt;
    if(a.warpAt&&!a.warped&&a.t>=a.warpAt){const p0=attackPoint(a);a.warped=true;a.dir=OPP[a.dir];const p1=attackPoint(a),t=B.tf; // 雷光転移：向きが反対へ
      fx.flash={c:'#e8fbff',life:0.12,max:0.12};fx.zaps.push({a:p0,b:p1,life:0.28,max:0.28});burst(p1.x,p1.y,'#e8fbff',22,420,true);B.shake=Math.max(B.shake,6)}
    // 冥炎：着弾前から炎を吐く
    if(a.kind==='breath'&&B.E.breath.type==='fire'&&a.t>a.w-Math.min(0.45,a.w*0.75)&&a.t<a.w+0.1){const h=headScreen(),p=PP();
      for(let i=0;i<3;i++){const ang=Math.atan2(p.y-h.y,p.x-h.x)+rand(-0.25,0.25),sp=rand(700,1000);fx.parts.push({x:h.x,y:h.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:rand(0.35,0.55),max:0.55,c:Math.random()<0.5?'#d070ff':'#ff70c0',r:rand(8,18),add:true,round:true,drag:0.97,grav:0})}}
    if(a.kind==='breath'&&B.E.breath.type==='bolt'&&a.t<a.w&&Math.random()<0.5){const h=headScreen();burst(h.x,h.y,'#e8fbff',1,120,true)}
    if(!a.lunged&&a.t>=a.w){a.lunged=true;if(!a.res)impact()}
    if(!a.res&&a.t>=a.w+LATE){resolveHit();if(!B.over)afterResolve()}}
  else if(B.state==='recover'){B.timer-=dt;if(B.timer<=0)nextAttack()}
  else if(B.state==='broken'){B.brokenT-=dt;if(B.brokenT<=0){B.posture=0;B.state='idle';B.timer=1.0;B.combo=0;float('体勢を立て直した',W/2,H*0.25,'#cdb89a',20,1)}}
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(B){update(dt);
    ctx.save();if(B.shake>0)ctx.translate((Math.random()-0.5)*B.shake,(Math.random()-0.5)*B.shake);
    drawBG();drawEnemy();drawBreath();drawTelegraph();drawPlayer();drawFX(dt);ctx.restore();drawLowHP();drawHUD();drawGimmickHUD();
    if(B.g.curse>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'rgba(120,0,200,0)');g.addColorStop(1,'rgba(120,0,200,0.35)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    if(fx.flash){ctx.fillStyle=rgba(fx.flash.c,0.45*fx.flash.life/fx.flash.max);ctx.fillRect(0,0,W,H)}
    if(B.hurt>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,`rgba(220,20,10,${B.hurt})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  }
  requestAnimationFrame(loop);
}
renderHub();requestAnimationFrame(loop);
</script>
