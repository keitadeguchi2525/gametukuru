.capsule.open{animation:pop .45s ease-out forwards}

</style>
</head>

try{showVer(JSON.parse(localStorage.getItem(VERKEY)))}catch(e){showVer(null)}
fetch(`https://api.github.com/repos/${REPO}/commits?sha=main&per_page=1`).then(r=>{if(!r.ok)throw 0;
  const m=/[?&]page=(\d+)>;\s*rel="last"/.exec(r.headers.get('Link')||'');return r.json().then(j=>{

// ===================== 雑魚（ボスの色違い）とダンジョン =====================
function mixHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
// 既存の敵の体つきを借りて、色・部位の名前・素材・飾りを差し替える（o.names / o.mats / o.decos は部位id→値）
function reskin(b,o,mix){return b.parts.map(p=>({...p,c:mixHex(p.c,o.tint,mix),name:(o.names||{})[p.id]||p.name,mat:(o.mats||{})[p.id]||p.mat,
  deco:(o.decos||{})[p.id]!==undefined?o.decos[p.id]:p.deco,ice:o.ice||p.ice,hp:p.hp?Math.round(p.hp*(o.partMul||1)):undefined}))}
// o.parts があれば、その体つき（専用の見た目）をそのまま使う。部位の体力は後で ENEMY_HP から決まるので hp:1 でよい

    case'katana':c.moveTo(4*s,-3*s);c.quadraticCurveTo(len*0.6,-8*s,len,-15*s);c.quadraticCurveTo(len*0.62,1*s,4*s,4*s);break;
    case'dark':c.moveTo(4*s,-6*s);for(let i=1;i<6;i++)c.lineTo(4*s+(len-4*s)*i/6,-(i%2?13:6)*s);c.lineTo(len,0);for(let i=5;i>0;i--)c.lineTo(4*s+(len-4*s)*i/6,(i%2?6:10)*s);c.lineTo(4*s,6*s);break;
    case'amber':c.moveTo(4*s,-7*s);c.lineTo(len*0.68,-13*s);c.lineTo(len,0);c.lineTo(len*0.68,13*s);c.lineTo(4*s,7*s);break;
    case'royal':c.moveTo(4*s,-8*s);c.lineTo(len*0.9,-5*s);c.lineTo(len*1.04,0);c.lineTo(len*0.9,5*s);c.lineTo(4*s,8*s);break;

      c.closePath();c.save();c.shadowBlur=0;c.fillStyle=w.shape==='vajra'?'#c89a30':'#6e4c2a';c.fillRect(0,-3*s,len*0.8,6*s);c.restore();
      c.beginPath();c.fillStyle=B;
      if(w.shape==='spear'){c.moveTo(len*0.74,-9*s);c.lineTo(len*1.06,0);c.lineTo(len*0.74,9*s);c.lineTo(len*0.8,0)}
      else{c.moveTo(len*0.76,-5*s);c.lineTo(len*1.1,0);c.lineTo(len*0.76,5*s);c.closePath();
        for(const sg of[-1,1]){c.moveTo(len*0.76,sg*4*s);c.lineTo(len*0.86,sg*14*s);c.lineTo(len*0.9,sg*8*s);c.lineTo(len*0.98,sg*16*s);c.lineTo(len*0.88,sg*4*s);c.closePath()}}
      break}
  }

  c.fill();c.stroke();c.globalAlpha=1;c.shadowBlur=0;

  if(w.shape==='katana'){c.strokeStyle='rgba(255,255,255,0.7)';c.lineWidth=1*s;c.beginPath();c.moveTo(6*s,0);c.quadraticCurveTo(len*0.6,-4*s,len*0.95,-12*s);c.stroke()}
  if(!long){const gw=w.shape==='great'?18:w.shape==='royal'?15:12;c.fillStyle=w.shape==='royal'?'#ffe070':w.shape==='dark'?'#5a3a80':'#b88a3a';c.fillRect(-1*s,-gw*s,6*s,gw*2*s);
    if(w.shape==='royal'){c.fillStyle='#b040ff';c.beginPath();c.arc(2*s,0,4*s,0,Math.PI*2);c.fill()}}
  c.restore();
}

// 音声ファイルは使わず、Web Audio API でその場で音を合成する。
// ブラウザの決まりで、最初のタップ／クリック／キー入力のあとから鳴らせるようになる。
const SND={ctx:null,master:null,sfxBus:null,bgmBus:null,delay:null,noise:null,want:'hub',song:null,step:0,next:0,opt:{sfx:true,bgm:true}};
const SFX_VOL=0.7,BGM_VOL=0.22;   // 効果音／BGM の音量（0〜1）
try{const o=JSON.parse(localStorage.getItem('parryHunter_audio'));if(o)Object.assign(SND.opt,o)}catch(e){}
function audioInit(){
  if(SND.ctx){if(SND.ctx.state==='suspended')SND.ctx.resume();return}
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();SND.ctx=c;
    SND.master=c.createGain();SND.master.gain.value=0.9;SND.master.connect(c.destination);
    SND.sfxBus=c.createGain();SND.sfxBus.gain.value=SND.opt.sfx?SFX_VOL:0;SND.sfxBus.connect(SND.master);
    SND.bgmBus=c.createGain();SND.bgmBus.gain.value=SND.opt.bgm?BGM_VOL:0;SND.bgmBus.connect(SND.master);
    const d=c.createDelay(1);d.delayTime.value=0.32;const fb=c.createGain();fb.gain.value=0.32;const wet=c.createGain();wet.gain.value=0.35;
    d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(SND.bgmBus);SND.delay=d;
    const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;SND.noise=buf;
    setInterval(bgmTick,25);bgm(SND.want,true);
  }catch(e){SND.ctx=null}
}
addEventListener('pointerdown',audioInit,true);addEventListener('keydown',audioInit,true);
function setAudio(kind,on){

  if(SND.ctx){const t=SND.ctx.currentTime,g=(kind==='sfx'?SND.sfxBus:SND.bgmBus).gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.setTargetAtTime(on?(kind==='sfx'?SFX_VOL:BGM_VOL):0,t,0.05)}

// 基本の音：音程つき（tone）とノイズ（noise）
function tone(f,dur,{type='sine',vol=0.3,to=null,at=0,attack=0.005,det=0}={}){
  const c=SND.ctx;const t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=det;
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(SND.sfxBus);o.start(t);o.stop(t+dur+0.03);
}
function noise(dur,{vol=0.3,f=1000,q=1,ftype='bandpass',to=null,at=0,attack=0.003}={}){
  const c=SND.ctx;const t=c.currentTime+at,s=c.createBufferSource();s.buffer=SND.noise;
  const fl=c.createBiquadFilter();fl.type=ftype;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;if(to)fl.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+dur);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(SND.sfxBus);s.start(t,Math.random()*0.4);s.stop(t+dur+0.03);
}

function sfx(name,...a){if(!SND.ctx||!SND.opt.sfx||SND.ctx.state!=='running')return;try{SFX[name](...a)}catch(e){}}

function bgm(name,force){
  SND.want=name;const c=SND.ctx;if(!c)return;if(!force&&SND.song&&SND.song.name===name)return;
  SND.song=name?{name,...SONGS[name]}:null;SND.step=0;SND.next=c.currentTime+0.15;
  const g=SND.bgmBus.gain;g.cancelScheduledValues(c.currentTime);g.setValueAtTime(0.0001,c.currentTime);g.linearRampToValueAtTime(SND.opt.bgm?BGM_VOL:0,c.currentTime+1.0);
}
function bgmTick(){const c=SND.ctx,s=SND.song;if(!c||!s||c.state!=='running')return;const sd=60/s.bpm/4;
  if(SND.next<c.currentTime)SND.next=c.currentTime+0.05;
  while(SND.next<c.currentTime+0.15){playStep(s,SND.step,SND.next,sd);SND.step++;SND.next+=sd}}
function voice(f,t,dur,type,vol,{cut=2000,attack=0.005,det=0,echo=false}={}){
  const c=SND.ctx,o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();o.type=type;o.frequency.value=f;o.detune.value=det;fl.type='lowpass';fl.frequency.value=cut;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(fl);fl.connect(g);g.connect(SND.bgmBus);if(echo)g.connect(SND.delay);o.start(t);o.stop(t+dur+0.05);
}
function drum(kind,t,vol=1){const c=SND.ctx;
  if(kind==='k'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.15);g.gain.setValueAtTime(0.8*vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.connect(g);g.connect(SND.bgmBus);o.start(t);o.stop(t+0.3);return}
  const s=c.createBufferSource();s.buffer=SND.noise;const f=c.createBiquadFilter(),h=kind==='h';f.type=h?'highpass':'bandpass';f.frequency.value=h?7000:1800;
  const g=c.createGain(),d=h?0.05:0.18;g.gain.setValueAtTime((h?0.25:0.45)*vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(SND.bgmBus);s.start(t,Math.random());s.stop(t+d+0.02)}
function playStep(s,i,t,sd){
  const st=i%16,ch=s.prog[Math.floor(i/16)%s.prog.length];
  if(st===0&&s.pad)for(const n of ch)voice(mf(s.root+12+n),t,sd*16*1.05,'sawtooth',0.045,{cut:s.padCut||900,attack:sd*4,det:(Math.random()-0.5)*14});
  if(s.bass&&s.bass[st]==='x')voice(mf(s.root+ch[0]),t,sd*(s.bassLen||3),s.bassType||'triangle',0.3,{cut:600});
  if(s.arpOn&&s.arpOn[st]==='x')voice(mf(s.root+ch[st%ch.length]+(s.arpOct||24)),t,sd*2.5,s.arpType||'triangle',s.arpVol||0.07,{cut:4000,echo:true});
  if(s.kick&&s.kick[st]==='x')drum('k',t);if(s.snare&&s.snare[st]==='x')drum('s',t);if(s.hat&&s.hat[st]==='x')drum('h',t,s.hatVol?s.hatVol/0.25:1);
}

const chip=(k,txt,cls='')=>`<span class="chip ${cls} ${MATS[k].rare?'r'+MATS[k].rare:''}"><img src="${ICON[k]}">${txt}</span>`;
function costChips(c){const e=Object.entries(c);if(!e.length)return '<span class="chip" style="padding:3px 8px">素材不要</span>';
  return e.map(([k,q])=>{const h=S.mats[k]||0;return chip(k,`${MATS[k].n} ${h}/${q}`,h<q?'ng':'')}).join('')}
const pct=p=>p>=0.01?Math.round(p*100)+'%':(p*100).toFixed(p>=0.001?1:2)+'%';
function renderHub(){
  const w=W_(S.eqW),as=armStat();
  $('#equip').innerHTML=`<span><img src="${weaponIcon(w)}">武器 <b>${w.name}+${S.weapons[w.id]}</b>（攻撃 ${atkStat()}）</span><span>${eqPieces().map(p=>`<img src="${armorIcon(p)}" title="${p.name}+${S.armors[p.id]}">`).join('')}防具 合計 <b>防御 ${as.def} / 体力 +${as.hp}</b></span>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  let h='';
  if(tab==='hunt'){
    h+=`<div class="card" style="border-color:#7a2a20"><p style="color:#ffb0a0;margin:0">⚠ ダンジョンで手に入れた素材は<b>帰還するまで未確定</b>。倒れると<b>その探索の戦利品と、装備中の武器・防具（5つ）のうちランダムに1〜3つを失う</b>（初期装備は強化が+0に戻る）。階の合間に「帰還」すれば戦利品も装備も守れる（戦闘中に逃げることはできない）。</p></div>`;
    DUNGEONS.forEach((D,i)=>{const lock=!unlocked(i),open=OPEN_DETAIL[D.id]&&!lock;
      // 前のダンジョンを踏破していないうちは、星の数だけ見せて名前・説明は「???」
      h+=`<div class="card ${lock?'locked':''}"><h3>${'★'.repeat(D.stars)} ${lock?'???':`${D.name}（全${D.floors.length}階）`} ${S.cleared[D.id]?'<span class="tag ok">踏破済</span>':''}</h3>
      <p>${lock?'🔒 ???':D.desc}</p>`;
      if(open){const y=YIELD[D.id];
        // レア素材：1回踏破で1個以上出る確率（全階の討伐ぶんを合算）
        const rp={};for(const id of D.floors)for(const[k,pr]of EN(id).rares)rp[k]=1-(1-(rp[k]||0))*(1-pr);

  }else if(tab==='forge'){
    const sec=(title,list,kind)=>{h+=`<div class="sect">${title}</div>`;
      list.forEach(it=>{const own=kind==='w'?S.weapons:S.armors;const lv=own[it.id];const owned=lv!==undefined;

// 体勢ポイント：敵ごとに必要ポイントがあり（PT×段階）、時間で増える。パリィ=25pt、強撃=50pt、PERFECT=+5pt、被弾=-25pt

function needNow(){return PT*needLv()}
function addPosture(v,x,y,label){if(v<=0)return;B.posture+=v;float(`${label?label+' ':''}体勢 +${v}`,x,y,'#9fe0ff',18,0.9)}

function burst(x,y,c,n=14,sp=260,add=false){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(sp*0.3,sp);fx.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.25,0.6),max:0.6,c,r:rand(1.5,4),add})}}

// --- 敵の攻撃 ---
function pickMove(){const m=B.E.moves,tot=m.reduce((a,b)=>a+b[1],0);let r=Math.random()*tot;for(const[k,w]of m){if((r-=w)<0)return k}return 'slash'}
const SPD=0.72,IDLE=0.5;   // 攻撃速度・頻度の全体倍率
const OPP={R:'L',L:'R',U:'D',D:'U',UR:'DL',DL:'UR',UL:'DR',DR:'UL'};
function nextAttack(){
  const E=B.E;B.state='idle';
  if(B.flurry){B.timer=0.06;return}
  if(B.combo>0){B.combo--;B.timer=0.16}else{B.combo=ri(0,E.combo);B.timer=rand(E.idle[0],E.idle[1])*IDLE*(B.g.phase2?0.7:1)}
}
function beginAttack(){
  const E=B.E;let kind,dir,w;
  let fl=false;const ph=(B.g.phase2?0.85:1)*(B.g.storm>0?STORM_SPEED:1);
  if(B.flurry){const d=B.flurry.dirs[B.flurry.idx++];fl=true;

const earlyWin=()=>Math.min(0.3,B.atk.w*0.45)*perk('parry')*coldMul();
const dodgeWin=()=>DODGEWIN*perk('dodge')*coldMul();
// ★4 グラシエル【寒さ】：時間がたつほどパリィ・回避の受付が短くなる（最低×0.6）。HP50%以下の吹雪でさらに×0.85
const COLD_RATE=0.004,COLD_MIN=0.6,BLIZZARD_MUL=0.85;

const needDir=a=>a.cursed?a.dir:OPP[a.dir];   // 攻撃が来た方向へはじき返す（呪い中は逆）

function afterResolve(){ // 1回の攻撃が終わったあとの共通処理

function tryParry(ang){

  fx.slashes.push({ang:DIRS[a.dir],life:0.18,max:0.18,c:'#ffffff',parried:true});

// 回避に成功すると INVINCIBLE 秒のあいだ無敵。ただし効くのは「落下物がからむとき」だけ
//   ・攻撃をよけた直後の落下物 → 当たらない
//   ・落下物をよけた直後の攻撃／落下物 → 当たらない
//   ・攻撃をよけた直後の攻撃（連撃の次・投擲など）→ 無敵は効かない（1つずつよける）
//   空振りの回避では無敵にならない
const INVINCIBLE=0.6;
function grantInv(src){B.invUntil=B.t+INVINCIBLE;B.invSrc=src}
const invOn=()=>!!B&&B.t<(B.invUntil||0);
const invVsAttack=()=>invOn()&&B.invSrc==='hz';   // 敵の攻撃に対して効くのは、落下物をよけたあとの無敵だけ
const invVsHazard=()=>invOn();                    // 落下物には、どちらをよけたあとの無敵でも効く
const invuln=invVsAttack;
// パリィに失敗すると少しのあいだ回避できない
function failLock(){if(B.atk&&B.atk.fl)return;B.noDodgeT=PARRY_FAIL_LOCK}   // 連撃中の失敗はすぐ回避できる
function doDodge(dir='R'){

  if(B.noDodgeT>0){if(!B.lockMsg){B.lockMsg=0.3;sfx('fail');float('体勢が崩れて回避できない！',W/2,H*0.7,'#ff8f7a',20,0.7)}return}
  B.dodgeCD=0.45;B.dodgeAt=B.t;B.dodgeDir=dir;sfx('dodge');B.dAnim={t:0,dur:0.38,side:dir==='L'?-1:1};
}
function impact(){

}
function resolveHit(){

// --- プレイヤーの攻撃（こすり） ---
function strike(p,f,x,y,ang){

  burst(x,y,crit?'#ff9a6a':'#ffcf8a',crit?14:7,crit?340:220);B.shake=Math.max(B.shake,crit?7:3);
  fx.slashes.push({ang,life:0.14,max:0.14,c:W_(S.eqW).glow,at:{x,y},small:true});

const G_FREEZE_SEC=2;                                      // 凍結：崩し時間+2秒
const cutMul=()=>1-Math.min(0.8,perk('dmgCut'));          // 被ダメージの倍率（岩王剣で0.75）

function drawSpecialFX(dt){if(!fx.special||!fx.special.length)return;

  if(live.length)label(`⚠ ${hz.name}！ 落ちる瞬間に回避`,dodgeWin()>=Math.min(...live.map(i=>i.w-i.t))?'#ff4af0':hz.c,H*0.4)}
// ★4 寒さの画面効果：受付が短くなるほど画面のふちが白く凍る。吹雪中は雪が横に流れる
function drawCold(){if(!B||B.E.gimmick!=='cold'||B.dying)return;const k=1-coldMul();if(k<=0.01)return;
  const big=Math.hypot(W,H)/2,g=ctx.createRadialGradient(W/2,H/2,big*(0.95-k*0.9),W/2,H/2,big*1.05);
  g.addColorStop(0,'rgba(200,240,255,0)');g.addColorStop(1,`rgba(220,245,255,${Math.min(0.75,k*1.6)})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(B.g.blizzard){ctx.strokeStyle='rgba(240,250,255,0.55)';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<70;i++){const x=W-((i*97.3+B.t*700*(1+(i%3)*0.3))%(W+200))+100,y=(i*53.7+B.t*90)%H;ctx.moveTo(x,y);ctx.lineTo(x+26,y-6)}ctx.stroke()}}
function gimmicks(dt){
  const E=B.E,g=B.g;
  if(E.gimmick==='orbs'){if(B.state==='orbs')updateOrbs(dt);else if(B.state!=='broken'){g.orbCD-=dt;if(g.orbCD<=0&&B.state==='idle'&&!B.flurry){spawnOrbs();return}}}
  const hz=hazard();
  if(hz){updateHazards(dt);if(B.over)return;
    if(B.state!=='broken'&&B.state!=='orbs'&&!B.hz.length){g.hzCD-=dt;
      if(g.hzCD<=0){spawnHazard(0);
        // 2連続：ダンジョンごとの確率。氷霊獣グラシエルはHP50%以下で50%
        const dbl=E.id==='glacier'&&B.hp<=B.maxHp*0.5?0.5:hz.dbl;
        if(Math.random()<dbl){spawnHazard(0.8);float(`${hz.name}が2連続！`,W/2,H*0.3,hz.c,22,1.2)}
        g.hzCD=hzEvery()*rand(0.8,1.2)}}}
  if(E.gimmick==='cold'&&!g.blizzard&&B.hp<=B.maxHp*0.5){g.blizzard=true;sfx('blizzard');fx.flash={c:'#e8f8ff',life:0.5,max:0.5};B.shake=14;
    float('吹雪！ さらに凍える',W/2,H*0.28,'#e8f8ff',30,1.8);float('パリィ・回避の受付がもっと短くなった',W/2,H*0.28+30,'#bff4ff',18,1.8)}
  if(E.gimmick==='armor'&&!g.armorDone&&(B.hp<=B.maxHp*0.6||g.trig)){g.armorDone=true;g.armor=g.armorMax;
    sfx('armor');float('岩鎧をまとった！',W/2,H*0.28,'#d8c8b0',30,1.8);float('体勢崩し3回目で砕ける',W/2,H*0.28+30,'#d8c8b0',18,1.8);B.shake=16;burst(B.tf.x,B.tf.y,'#9a8a78',40,500);cancelBreak()}
  if(E.gimmick==='storm'){
    if(g.storm>0){g.storm-=dt;if(Math.random()<0.6){const t=B.tf;burst(t.x+rand(-1,1)*t.u*0.7,t.y+rand(-1,1)*t.u*0.6,'#dff8ff',1,220,true)}
      if(g.storm<=0){g.storm=0;float('雷速モードが解けた',W/2,H*0.25,'#cdb89a',20,1)}}
    else{const head=B.parts.find(p=>p.id==='head');g.charge=Math.min(1,g.charge+dt/STORM_CHARGE*(head.broken?0.5:1));
      if(g.charge>0.6&&Math.random()<g.charge*0.35){const t=B.tf;burst(t.x+rand(-1,1)*t.u*0.6,t.y+rand(-1,1)*t.u*0.5,'#bff0ff',1,150,true)}
      if(g.charge>=1&&B.state==='idle'){g.charge=0;g.storm=STORM_TIME;fx.flash={c:'#bff4ff',life:0.35,max:0.35};B.roar=0.8;B.shake=12;
        sfx('thunder');float('雷速モード！',W/2,H*0.26,'#bff4ff',32,1.8);float('雷光が走ったら、攻撃の向きが反対になる',W/2,H*0.26+30,'#bff4ff',16,1.8)}}}
  if(E.gimmick==='curse'){
    const core=B.parts.find(p=>p.id==='core');
    if(!core.broken){for(const p of B.parts)if(!p.body&&!p.broken)p.hp=Math.min(p.maxHp,p.hp+p.maxHp*0.004*dt)}
    if(!core.broken&&B.hp<B.maxHp){const r=B.maxHp*0.004*dt;B.hp=Math.min(B.maxHp,B.hp+r);g.regenAcc+=r;
      if(g.regenAcc>=40){const t=B.tf,pt=toScreen(core.x*t.u,core.y*t.u);float('+'+Math.round(g.regenAcc)+' 再生',pt.x+40,pt.y,'#7aff9a',16,0.8);g.regenAcc=0}}
    if(!g.phase2&&(B.hp<=B.maxHp*0.5||g.trig)){g.phase2=true;g.trig=false;cancelBreak();B.E={...B.E,glow:'#ff3050',eye:'#ff2030',bg:['#3a1020','#100408']};
      sfx('roar');float('冥王が真の姿を現した！',W/2,H*0.28,'#ff6a8a',30,2);B.shake=22;burst(B.tf.x,B.tf.y,'#ff3050',60,600,true)}
    if(g.phase2){if(g.curse>0){g.curse-=dt;if(g.curse<=0)float('呪いが解けた',W/2,H*0.25,'#cdb89a',20,1)}
      else{g.curseCD-=dt;if(g.curseCD<=0){g.curse=8;g.curseCD=14;sfx('curse');float('反転の呪い！ 紫の輪は逆へはじけ！',W/2,H*0.25,'#d070ff',26,1.8);fx.flash={c:'#a040ff',life:0.4,max:0.4}}}}
  }
}
function update(dt){
  B.t+=dt;
  for(const k of['lunge','recoil','hurt','bounce','dodgeCD','roar','noDodgeT','lockMsg'])B[k]=Math.max(0,B[k]-dt);
  B.shake=Math.max(0,B.shake-dt*40);
  for(const p of B.parts)p.flash=Math.max(0,p.flash-dt);
  if(B.pAnim){B.pAnim.t+=dt;if(B.pAnim.t>B.pAnim.dur+0.12)B.pAnim=null}
  if(B.dAnim){B.dAnim.t+=dt;if(B.dAnim.t>B.dAnim.dur)B.dAnim=null}
  if(fx.flash){fx.flash.life-=dt;if(fx.flash.life<=0)fx.flash=null}
  if(B.dying)B.fade=Math.max(0,B.fade-dt*0.7);
  const a=B.atk;
  const locked=B.noDodgeT>0||!!(B.state==='windup'&&a&&a.noDodge);
  const hzLive=!!(B.hz&&B.hz.some(i=>!i.landed&&i.t>=0)),br=B.state==='windup'&&a&&a.kind==='breath';
  for(const d of['L','R']){const bt=dodgeBtns[d];
    bt.classList.toggle('lock',locked&&!B.over);
    // 光らせるのは「よけるべき側」のボタン。落下物とパリィ失敗はどちらでもよいので両方
    bt.classList.toggle('warn',!locked&&!B.over&&(hzLive||(br&&safeSide(a)===d)||(B.state==='windup'&&a&&a.fail&&a.kind!=='breath')));
    bt.classList.toggle('cd',B.dodgeCD>0)}
  if(B.over)return;
  { // 瀕死の鼓動（体力35%未満で、減るほど速く）
    const r=B.php/B.pmax;if(r<0.35&&r>0){B.hb=(B.hb||0)-dt;if(B.hb<=0){sfx('heart');B.hb=60/(70+(0.35-r)*240)}}}
  const n=needNow();if(n>B.lastNeed){B.lastNeed=n;sfx('warn');float(`敵が警戒を強めた！ 必要ポイント +${PT}`,W/2,H*0.2,'#ff9a6a',20,1.6)}
  gimmicks(dt);if(B.over)return;
  if(B.epoison.length){ // ボス武器の毒：敵に1秒ごとダメージ
    for(const p of B.epoison){p.next-=dt;if(p.next<=0&&p.ticks>0){p.next+=1;p.ticks--;const d=Math.max(1,Math.round(B.maxHp*G_POISON_PCT*(B.g.armor>0?0.2:1)));B.hp-=d;guardPhase();
      float('毒 '+d,B.tf.x+rand(-40,40),B.tf.y-B.tf.u*0.3,'#b0ff40',20,0.8)}}
    B.epoison=B.epoison.filter(p=>p.ticks>0);if(B.hp<=0&&!B.over){victory();return}}
  if(B.poison.length){ // 毒の継続ダメージ（防御では減らない）
    let d=0;for(const p of B.poison){const k=Math.min(dt,p.left);d+=p.dps*k*cutMul();p.left-=dt}B.poison=B.poison.filter(p=>p.left>0);
    B.php-=d;B.poisonAcc+=d;if(B.poisonAcc>=4){float('-'+Math.round(B.poisonAcc),W/2+rand(-30,30),H*0.78,'#b0ff40',18,0.7);B.poisonAcc=0}
    if(B.php<=0){B.php=0;B.over=true;bgm(null);setTimeout(died,900);return}}
  if(B.state==='idle'){B.timer-=dt;if(B.timer<=0)beginAttack()}
  else if(B.state==='windup'){
    if(a.holdLeft>0&&a.t>=a.holdAt)a.holdLeft-=dt;else a.t+=dt;
    if(a.warpAt&&!a.warped&&a.t>=a.warpAt){const p0=attackPoint(a);a.warped=true;a.dir=OPP[a.dir];const p1=attackPoint(a),t=B.tf; // 雷光転移：向きが反対へ
      fx.flash={c:'#e8fbff',life:0.12,max:0.12};fx.zaps.push({a:p0,b:p1,life:0.28,max:0.28});sfx('zap');burst(p1.x,p1.y,'#e8fbff',22,420,true);B.shake=Math.max(B.shake,6)}
    // 冥炎：着弾前から炎を吐く
    if(a.kind==='breath'&&B.E.breath.type==='fire'&&a.t>a.w-Math.min(0.45,a.w*0.75)&&a.t<a.w+0.1){const h=headScreen(),p=breathTarget(a);
      for(let i=0;i<3;i++){const ang=Math.atan2(p.y-h.y,p.x-h.x)+rand(-0.25,0.25),sp=rand(700,1000);fx.parts.push({x:h.x,y:h.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:rand(0.35,0.55),max:0.55,c:Math.random()<0.5?B.E.breath.c:shade(B.E.breath.c,0.4),r:rand(8,18),add:true,round:true,drag:0.97,grav:0})}}
    if(a.kind==='breath'&&B.E.breath.type==='bolt'&&a.t<a.w&&Math.random()<0.5){const h=headScreen();burst(h.x,h.y,'#e8fbff',1,120,true)}
    if(!a.lunged&&a.t>=a.w){a.lunged=true;if(!a.res)impact()}
    if(!a.res&&a.t>=a.w+LATE){resolveHit();if(!B.over)afterResolve()}}
  else if(B.state==='recover'){B.timer-=dt;if(B.timer<=0)nextAttack()}
  else if(B.state==='broken'){B.brokenT-=dt;if(B.brokenT<=0){B.frozenBreak=false;B.posture=0;B.state='idle';B.timer=1.0;B.combo=0;float('体勢を立て直した',W/2,H*0.25,'#cdb89a',20,1)}}
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(B){update(dt);
    ctx.save();if(B.shake>0)ctx.translate((Math.random()-0.5)*B.shake,(Math.random()-0.5)*B.shake);
    drawBG();drawEnemy();drawBreath();drawTelegraph();drawPlayer();if(B.flRow&&B.atk&&B.atk.fl)drawFlurryRow(W/2,B.flRow.y,B.flRow.col);drawHazards();drawFX(dt);drawSpecialFX(dt);ctx.restore();drawOrbs();drawCold();drawLowHP();drawHUD();drawGimmickHUD();
    if(B.g.curse>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'rgba(120,0,200,0)');g.addColorStop(1,'rgba(120,0,200,0.35)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    if(fx.flash){ctx.fillStyle=rgba(fx.flash.c,0.45*fx.flash.life/fx.flash.max);ctx.fillRect(0,0,W,H)}
    if(B.hurt>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,`rgba(220,20,10,${B.hurt})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  }
  requestAnimationFrame(loop);
}
renderHub();requestAnimationFrame(loop);
</script>
